apiVersion: v1
kind: Pod
metadata:
  name: __POD_NAME__
  labels:
    app.kubernetes.io/name: compshare-agent-migrate
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 300
  imagePullSecrets:
    - name: regcred
  containers:
    - name: migrate
      image: __IMAGE__
      imagePullPolicy: Always
      command: ["/bin/sh", "-ec"]
      args:
        - |
          export PGCONNECT_TIMEOUT=15
          DSN=$(sed -n 's/^[[:space:]]*dsn:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' /opt/compshare-agent/deploy/conf/config.yaml)
          DB_HOST=$(sed -n 's/^[[:space:]]*host_override:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' /opt/compshare-agent/deploy/conf/config.yaml)
          test -n "$DSN"
          test -n "$DB_HOST"
          for migration in /opt/compshare-agent/deploy/migrations/*.sql; do
            psql "$DSN" -h "$DB_HOST" -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop:
            - ALL
