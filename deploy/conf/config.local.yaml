agent:
  compshare_api_url: "https://api.compshare.cn/"
  # Optional direct AK/SK for local development. Server production uses STS.
  public_key: ""
  private_key: ""
  region: "cn-wlcb"
  # Optional deployment-wide ProjectId; request-scoped values take precedence.
  project_id: ""

  # 飞书话题群知识问答入口。由 `compshare-agent feishu` 单独启动；
  # Agent 的回答能力仍来自本服务，飞书应用只负责收发群消息。
  feishu:
    app_id: "cli_aae1adb5ff385bb4"     # 飞书自建应用 App ID
    app_secret: "EX4MKvnGW10qqFlNjcrHShXPXlf5IujV" # 飞书自建应用 App Secret
    agent_ws_url: "ws://127.0.0.1:7429/?Action=CreateCSAgentWS"
    company_id: 66391350               # 当前项目的固定测试账号身份
    organization_id: 64404856
    project_id: "org-cwy2qk"
    user_email: "feishu-bot@compshare.local"
    # 必填白名单。首次联调可临时写 ["*"]，从日志取得 chat_id 后立即收紧。
    allowed_chat_ids: ["oc_2b31629a0c15e04e41fc53e74c270084"]
    # 新话题首帖及发起者对话题根消息的后续提问免 @。
    # 发起者在其他用户评论下的回复不会自动触发。
    auto_reply_new_topics: true
    # 关闭全消息模式：其他成员评论和嵌套评论只有显式 @机器人 时才会进入话题会话。
    auto_reply_all_messages: false
    max_concurrent: 4
    max_reply_runes: 3500
    max_image_bytes: 5242880
    # The bootstrap refresh token is deliberately left empty in Git. GitLab
    # injects the protected CI/CD variable at image-build time.
    external_image_oauth:
      enabled: true
      redirect_url: "http://127.0.0.1:18765/feishu-oauth/callback"
      bootstrap_refresh_token: ""

  llm:
    base_url: "https://api.modelverse.cn/v1"
    # Answer model key (gpt-5.6-terra). Knowledge retrieval is owned by the
    # separately deployed compshare-kb service, so this process never reuses the
    # answer key for embedding or reranking. Inlined per deploy convention; like
    # the platform key it is published in this repo's history, so rotate it with
    # the standing key rotation.
    api_key: "HpiGXzD7p1cuChPiCe8e5841-048D-4e73-9675-E83dD0D1"
    # Production answer model.
    model: "gpt-5.6-terra"

  # Runtime authorization. Agent execution behavior has no rollout switch.
  authorization:
    # Enables confirmation-gated product writes. Destructive actions remain
    # refused by policy regardless of this value.
    mutating_tools: true

  # Production knowledge comes from the separately deployed compshare-kb MCP.
  retrieval:
    mcp_url: "http://compshare-kb.prj-ucompshare-prod.svc.c5.u4/mcp"
    # mcp_bearer_token: ""             # COMPSHARE_KB_MCP_BEARER_TOKEN (read token only)
    # mcp_timeout_ms: 12000             # COMPSHARE_KB_MCP_TIMEOUT_MS

  # Per-turn trace/observability. PostgreSQL persistence requires migrations
  # 0002 and 0004.
  trace:
    sink: mysql                        # file | mysql; empty disables tracing
    dir: ""                            # JSONL dir for the file sink

  # Consent-gated in-instance diagnosis and repair. It requires tenant-scoped
  # STS, PostgreSQL audit schema 0011–0014 and the Python harness environment.
  # See deploy/ssh_ops_harness/README.md for the command policy and deployment.
  ssh_ops:
    harness_path: "/opt/compshare-agent/deploy/ssh_ops_harness/harness.py" # baked into the production image
    base_url: "https://api.modelverse.cn" # direct Anthropic-compatible /v1/messages endpoint
    api_key: ""                        # empty = inherit agent.llm.api_key (the production Terra key)
    python: "/opt/miniforge3/envs/py313/bin/python" # production Python 3.13 env with requirements.txt installed
    model: "gpt-5.6-terra"
    timeout: "12m"
    # Mutating commands require per-command confirmation. Irrecoverable or
    # tenant/control-plane boundary violations remain refused.
    # Address routing is production-network-specific and lives in config.prod.yaml.

  # Per-tenant in-memory limits. A process restart resets daily counters;
  # multiple replicas require a shared limiter for a global quota.
  rate_limit:
    llm_qps: 5
    llm_daily: 5000
    mutating_qps: 1
    mutating_daily: 50
    read_expensive_qps: 6
    read_expensive_daily: 500
    # Per-tenant cap on user-initiated chat turns (one user_message frame
    # = 1 turn; confirm responses and pings do NOT count).
    user_turn_qps: 2      # max 2 messages/sec per tenant; 0 = no QPS cap
    user_turn_daily: 50   # 0 = no daily cap; per-tenant production cap
    # Total prompt + completion tokens across all LLM calls in one user turn.
    # When reached, the engine synthesizes from evidence already collected.
    max_tokens_per_turn: 400000

  # HTTP service settings (used by: compshare-agent server).
  # write_timeout must be 0 for SSE streaming connections.
  http:
    listen_addr: "0.0.0.0:7429"
    read_timeout: "30s"
    write_timeout: "0s"
    sse_keepalive_interval: "15s"
    max_input_length: 4000
    pool_capacity: 200
    pool_idle_ttl: "30m"
    # Product quota. Model history is bounded separately by request size.
    max_session_turns: 20
    # Production gateway owns CORS headers.
    disable_cors: true

  # PostgreSQL backing store (used by: compshare-agent server). The config key
  # `mysql` is kept for compatibility; the value is a libpq URL, e.g.
  # postgresql://user:pass@host:5432/db?sslmode=disable.
  mysql:
    dsn: "postgresql://root:U3JSFCnwt5dfcC5f@117.50.198.43:5432/postgres?sslmode=disable"
    # The c5 production cluster reaches PostgreSQL through its IPv6 address.
    # Keep credentials, database, and query parameters in dsn; only this host
    # is deployment-specific.
    max_open_conns: 20
    max_idle_conns: 5
    conn_max_lifetime: "1h"

  # Static metadata returned by GetMeta action.
  meta:
    welcome: "我是 Compshare Copilot，可以问我控制台相关问题。"
    suggested_prompts:
      - "我有哪些实例"
      - "4090 现在有库存吗"
      - "创建实例的操作步骤"

  # Screenshot understanding. Empty base_url/api_key inherit agent.llm;
  # an empty model falls back to MODELVERSE_QWEN_VL_MODEL or disables OCR.
  ocr:
    model: "qwen3-vl-flash"   # VL model for screenshot OCR / multimodal diagnosis; env fallback: MODELVERSE_QWEN_VL_MODEL
    base_url: ""           # inherits from agent.llm.base_url
    api_key: "Q1J7v8S9PewEW16c2e84171e-cBb5-4763-929D-6c03Fe44"               # qwen3-authorized retrieval key: the terra answer key CANNOT call qwen3-vl-*
    prompt: ""             # 留空=用内置结构化解读提示词(场景/关键信息/错误与可能原因)；设置可改写为更针对性的解读，如训练报错诊断
    timeout: "15s"
    max_bytes: 5242880     # 5MB

  # STS (Security Token Service) credential settings (used by: compshare-agent server).
  # service_ak/service_sk are the long-term service credentials used to mint
  # short-lived STS tokens for per-user API calls. Leave them empty when the
  # caller already supplies request-scoped credentials.
  # default_role_urn is optional; when set it overrides the per-request role derivation.
  sts:
    service_ak: "A4r4q1hNPGc1vxPhjuHO8S11INY"
    service_sk: "JhHiw05TOhdFGerfDcLZ3pK3CyxOYvhgZJp7K3TAVZSx"
    url: "https://api.ucloud.cn/"
    role_urn_template: "ucs:iam::%d:role/ucs-service-role/ServiceRoleForCompshare"
    default_session_name: "agent-cli"
    duration_seconds: 3600
    refresh_before: "5m"
    # Internal UAccount gateway for on-demand service-linked-role bootstrap.
    # Leave empty to surface RoleNotExist without bootstrap.
    iam_url: "http://internal.api.ucloud.cn"
