# Production inherits the local baseline so credential-bearing settings exist
# only once. Keep only production network overrides in this file.
extends: config.local.yaml

agent:
  # Keep the public production overlay credential-free. The baseline config
  # contains the allowlist and Feishu credentials; this enables each
  # topic initiator's root post and direct follow-ups without an @ mention.
  feishu:
    auto_reply_new_topics: true
    auto_reply_all_messages: false
    # Keep the external group limited to reviewed public catalog/inventory
    # reads. Account/instance reads, diagnoses and every write remain absent.
    enable_platform_readonly_queries: true
    # When RAG plus public platform data cannot close a question that needs an
    # authenticated instance diagnosis, direct the user here without forwarding
    # the Feishu conversation, screenshots, or identity.
    enable_console_handoff: true
    console_assistant_url: "https://console.compshare.cn/light-gpu/console"
    # Optional second handoff route. It is only a download/login link; the
    # desktop client owns any later CLI/SSH access under the user's own account.
    client_download_url: "https://www.compshare.cn/client"
  retrieval:
    mcp_url: "http://compshare-kb.prj-ucompshare-prod.svc.c5.uae/mcp"
  # Exa is deliberately opt-in after an explicit endpoint test. This overlay
  # wins over the shared baseline so deploying the adapter cannot start sending
  # customer questions to an external search provider by accident.
  web_search:
    enabled: false
  mysql:
    host_override: "2003:da8:2004:1000:0a3c:7623:2712:f9c0"
  ssh_ops:
    # Reach instances at their INTERNAL IPv6 rather than the public EIP their SshLoginCommand
    # advertises. Same kind of fact as host_override directly above — that line is already an
    # internal IPv6, and its last 64 bits embed the database's own private IPv4 (10.60.118.35,
    # read from the server itself) exactly the way an instance's does. This process has no
    # route to customer EIPs: measured 2026-08-06, 3 instances x 2 ports x 2 regions all timed
    # out from here while the identical transport connected in 0.30s / 1.20s from a normal
    # network, and one of those boxes actively REFUSED that port from outside — so if packets
    # were arriving at all, a wrong-port dial would have come back refused, not silent.
    #
    # Not the baseline: on a developer machine the opposite holds (the EIP is the only reachable
    # address and internal.api.ucloud.cn does not route), so putting it there would break every
    # local run of the lane.
    #
    # Only the HOST changes; user and port still come from SshLoginCommand, because they belong
    # to the image — a container image runs with `--net host`, so its sshd on 23 is bound on the
    # machine's own stack (verified in /proc/net/tcp6: LISTEN on :: for both 22 and 23). Pods are
    # never rewritten. Requires agent.sts.iam_url, and a failed rewrite REFUSES the run rather
    # than falling back to the address this setting exists because it cannot reach.
    internal_ipv6: true
    # SECOND candidate, tried only when the internal address above does not answer.
    #
    # Why a second one at all: internal_ipv6 reaches cn-wlcb-01 and does NOT reach cn-sh2-02.
    # The mapping resolves fine for both — the dial is what goes nowhere, because this process
    # runs in the c5 cluster and cn-sh2 sits behind c3, and there is no fabric route between
    # them. A translation prefix, if this network runs one, reaches the box without needing a
    # per-cluster route, so it would close cn-sh2-02 and every future self-owned zone at once.
    #
    # MEASURED from inside the cluster on 2026-08-16 — two full runs, zero disagreements:
    #   cn-wlcb-01    internal-ipv6      connects in ~1ms, sshd banner
    #   cn-sh2-02     internal-ipv6      times out at the full 4s, every time
    #   cn-sh2-02     public-v6-simple   connects in ~30ms, sshd banner
    #   all targets   public-v6-rfc6052  no route to host in under 1ms — never once answered
    #   all targets   advertised EIP     times out (CONTROL — the no-route premise still holds)
    # The control that makes this a ZONE result rather than one lucky machine: on cn-sh2-02 an
    # instance still Initializing REFUSED the prefix address in ~34ms while a healthy one in the
    # same zone accepted with a banner. A refusal is a packet that arrived and came back.
    #
    # The prefix needs no provenance argument, because the platform publishes it itself: every
    # *.podtcp.compshare.cn name resolves to <this prefix>::<the zone pod ingress's public IPv4
    # in the low 32 bits> — same prefix, same encoding public-v6-simple builds. (Kept only so
    # nobody re-derives it as a fresh doubt: this /48 decodes as the 6to4 block (RFC 3056) of a
    # private 10.64/16 address, RIPEstat reports origins=[] and 0 of 320 RIS peers, and neither
    # this repo nor uhost-compshare-api mentions 6to4 / NAT64 / SIIT. All true, and all beside
    # the point — this is a fabric-internal translator, not a public route. Instances carry no
    # global IPv6 at all: measured in-guest, /proc/net/if_inet6 holds only ::1 and a link-local
    # fe80::, yet they answer on the mapped address.)
    #
    # Both encodings are still built, because "prefix + IPv4" names two different addresses
    # (shown with a documentation address, RFC 5737 — never a real instance EIP, this repo is
    # public):
    #   simple   2002:a40:2e05::203.0.113.9      IPv4 in the low 32 bits  <- the one that works
    #   rfc6052  2002:a40:2e05:cb00:7100:900::   RFC 6052 §2.2 for a /48  <- never answered
    # rfc6052 is KEPT despite never winning, on its measured cost: it fails ENETUNREACH in well
    # under a millisecond rather than timing out, and it is only ever reached after simple has
    # already failed. Deleting it would save nothing and would remove the fallback if a zone ever
    # uses the other layout. Do not "clean it up" for tidiness.
    #
    # Ordering is the safety property: internal first, so every zone that works today keeps
    # dialling the same address; the public EIP is never a candidate in any position. If none
    # of the candidates accepts a TCP connection the run REFUSES and the log names each address
    # tried with its failure class — clearing this key restores the previous behaviour exactly.
    # Its KNOWN cost is a fixed 4s (perCandidateDialTimeout) burnt on every cn-sh2-02 run, and
    # that is accepted rather than overlooked: a per-zone candidate table is the rules layer this
    # design exists to avoid, caching the winning candidate would make a network change sticky
    # (exactly what the EIP control below is here to catch), and a shorter timeout would start
    # cutting off slow-but-working dials. If the 4s ever has to go, the honest fix is racing the
    # candidates concurrently and taking the first to answer — never reordering them per zone.
    #
    # Candidates after the winner are still probed, detached and after the address is chosen, and
    # only logged (「candidates NOT dialled」). That is how rfc6052 and the EIP keep being measured
    # on a zone that can judge them: a failure on a box known reachable from here is the
    # candidate's, whereas a failure on a zone with no route at all cannot separate "no
    # translator" from "translator that also cannot reach c3". Costs the run nothing; the
    # credential is already resolved when they fire.
    #
    # The advertised EIP rides that same list as a CONTROL — probed, never dialled. "This
    # deployment has no route to customer EIPs" is the premise everything here rests on;
    # re-measured 2026-08-16 (timeout on every target, both regions) and re-measured free on
    # every run, so a network change that opened that route shows up as a log line rather than
    # leaving us routing around a problem that had already been fixed.
    public_ipv6_prefix: "2002:a40:2e05::"
