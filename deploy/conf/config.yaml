agent:
  executor: external
  compshare_api_url: "https://api.compshare.cn/"
  # Legacy direct AK/SK. HTTP server mode uses these when STS service
  # credentials are empty (local/demo fallback).
  public_key: ""
  private_key: ""
  region: "cn-wlcb"
  # project_id 可选。留空时所有 read-only API 调用不带 ProjectId（CompShare
  # 服务端会回退到账号级默认行为）。如需固定项目（mutating tools 如开关机
  # 调度器需要），直接填写项目 ID。
  # 注：PR9 之前留空会触发 GetProjectList 自动发现并通过 SetProjectId 写入
  # 共享执行器；那是一条跨 session 串数据的路径，已经移除。运行时不再有
  # mutating setter，ProjectId 只在这里设置一次。
  # 本文件是完整部署配置；不再需要环境变量占位。
  project_id: ""

  llm:
    base_url: "https://api.modelverse.cn/v1"
    # Answer model key (gpt-5.6-terra). Authorized ONLY for terra — NOT for qwen3
    # embed/rerank — so it is a SEPARATE key from the retrieval key
    # (agent.retrieval.api_key below). Inlined per deploy convention; like the
    # platform key it is published in this repo's history, so rotate it with the
    # standing key rotation. To run a pro/flash answerer instead, put a
    # qwen3-capable key here and change model (then retrieval may inherit it).
    api_key: "HpiGXzD7p1cuChPiCe8e5841-048D-4e73-9675-E83dD0D1"
    # gpt-5.6-terra (ModelVerse GPT-5 Codex), default answerer since 2026-07-24:
    # on the reranked source-gap probes it reproduced in-corpus facts verbatim and
    # honestly declined true doc-gaps, where deepseek-v4-pro fabricated specifics;
    # also cheaper. Rollback: deepseek-v4-pro / deepseek-v4-flash (qwen3-capable
    # key required in LLM_API_KEY for those).
    model: "gpt-5.6-terra"

  # ──────────────────────────────────────────────────────────────────────
  # Runtime feature flags (previously env-only). Configure the whole agent
  # from THIS file — no env vars needed for behavior. Precedence: a value set
  # here WINS; if you omit a field the binary falls back to the matching env
  # var, and if that is unset too, to the built-in default. The values below
  # are the production deploy defaults.
  # forward). Set a field to false / "off" to roll one back.
  #
  # NOTE 截图理解 (screenshot/VL) is enabled separately by agent.ocr.model
  # below (qwen3-vl-flash) — it is already on.
  features:
    # Every chat turn is accepted, executed and committed through the durable
    # global coordinator. Requires migrations 0005 through 0010 before boot.
    # Keep this OFF while old binaries exist. Enable it only during a drained,
    # cluster-wide backend + frontend cutover; mixed legacy/durable execution
    # can process one conversation twice.
    durable_turns: false
    # Write operations: create/start/stop/reboot/reset-password/resize-disk.
    # Destructive actions (delete / L2 terminate) stay refused REGARDLESS.
    mutating_tools: true
    # Editable + guided GPU create flow. Durable v2 persists the reviewed form
    # and its validated edits, so refresh, replica changes and process restart
    # resume the same confirmation. The client must still opt in per turn with
    # confirm_form_v1 + guided_create_v1; selection cards remain unsupported.
    confirm_form: true
    guided_create: true
    # Agentic knowledge answering is a fixed runtime capability: retrieval is
    # chosen in-loop and every released knowledge answer uses the shared proof.
    external_knowledge: true            # merge external tool/ops corpus (vLLM/CUDA/Linux/PyTorch)
    # Context-engineering optimizations.
    session_fact_context: true          # near-term fact cache injected into context
    react_result_projection: true       # compress large read tool results before re-feeding ReAct
    react_history_compaction: true      # summarize old turns once history exceeds the window
    # Eval-gated / pilot flags. Keep unvalidated guards OFF; explicitly enable
    # guards only when their flag-on path is the validated production path.
    domain_match_guard: false           # wrong-domain REFUSE arm (#5 cite-relevance)
    forced_knowledge_hop: true          # retrieve once on the user's words before the Agent's first call (eval-gated on: complaint/statement retrieval 4→14, no fab, control net-zero)
    # INERT — parsed and forwarded, but nothing reads the overrides they emit;
    # the body-driven skill executor these gated no longer exists. Kept so an
    # older config file still loads. Setting either changes no behavior.
    skill_executor: false
    skill_executor_diagnosis_pilots: []

  # Knowledge retrieval / RAG. The default answer stack: curated retrieval,
  # qwen3 RRF. corpus/embeddings/model/timeout fields
  # are left empty = use the pinned built-in defaults; set them only to point
  # at a non-default corpus or tune timeouts.
  retrieval:
    knowledge_retrieval: curated        # curated | off
    mode: qwen3_rrf                     # qwen3_rrf | bm25_only | hybrid_cosine | hybrid_rerank | qwen3_full
    # qwen3 embed + rerank key (authorized for qwen3-embedding-8b /
    # qwen3-reranker-8b). SEPARATE from the terra answer key in agent.llm above.
    # Empty = inherit agent.llm.api_key (single-key mode, for a qwen3-capable
    # answer key). This platform key is already in the repo's git history; rotate
    # it with the standing key rotation. To move it out of the repo entirely,
    # replace with ${MODELVERSE_API_KEY} and set that env var.
    api_key: "Q1J7v8S9PewEW16c2e84171e-cBb5-4763-929D-6c03Fe44"
    # corpus_path: ""                  # COMPSHARE_KNOWLEDGE_CORPUS (default deploy/kb/stage2b_w0.jsonl)
    # embeddings_path: ""              # COMPSHARE_KNOWLEDGE_EMBEDDINGS (default: computed from digest)
    # external_corpus_path: ""        # COMPSHARE_EXTERNAL_KNOWLEDGE_CORPUS (default deploy/kb/external_w0.jsonl)
    # external_embeddings_path: ""    # COMPSHARE_EXTERNAL_KNOWLEDGE_EMBEDDINGS
    # embed_model: ""                 # MODELVERSE_EMBED_MODEL (default by mode)
    # reranker_model: ""              # MODELVERSE_RERANKER_MODEL (default qwen3-reranker-8b)
    # modelverse_base_url: ""         # MODELVERSE_BASE_URL (default https://api.modelverse.cn/v1)
    # hybrid_timeout_ms: 0            # RAG_HYBRID_TIMEOUT_MS (0 = retriever default 5s)
    # reranker_timeout_ms: 0          # RAG_RERANKER_TIMEOUT_MS (0 = reranker default 5s)

  # Per-turn trace/observability. sink=mysql writes one agent_traces row per
  # turn to the PostgreSQL database. PREREQUISITE: ops must run
  # deploy/migrations/0002 + 0004 DDL first; the writer degrades to the
  # trace_json blob if 0004 is not applied. Set enabled: false to disable.
  trace:
    enabled: true
    sink: mysql                        # file | mysql | both
    dir: ""                            # JSONL dir for file/both sinks; ignored for mysql

  # Consent-gated, read-only in-instance SSH-ops diagnosis lane (DiagnoseInstanceInternals).
  # Default OFF. When enabled: false the tool is absent from the model's window and nothing changes.
  # Server path requires a non-static STS provider (INV-12); it runs on the current non-durable WS/SSE
  # transport (no durable_turns dependency — the lane is read-only, so a disconnect just ends the probe
  # and the user retries). CLI path needs only enabled: true. harness_path/gateway_url are required when
  # enabled (boot fails loudly if enabled but unset). Host deps — a venv holding claude_agent_sdk, the
  # claude CLI, and a resident ccr gateway — are NOT checked at boot: a missing one first shows up as a
  # failed user-facing diagnosis. Fill/verify against deploy/ssh_ops_harness/README.md.
  ssh_ops:
    enabled: false
    harness_path: ""                   # absolute path to deploy/ssh_ops_harness/harness.py (required when enabled)
    gateway_url: ""                    # ANTHROPIC_BASE_URL of the local claude-code-router gateway (required when enabled)
    python: ""                         # venv interpreter, ABSOLUTE path. Empty falls back to "python3", and the
                                       # system python3 has no claude_agent_sdk — so empty is broken, not defaulted.
    # "provider,model" two-part form only. ccr's routing table has no entry for a bare model name, so a
    # bare name — and an empty value, which falls back to agent.llm.model, itself bare — is served as
    # deepseek-v4-flash with no error and no warning: the only symptom is worse diagnosis. pro is the
    # measured arm (paired N=3 on one real fault: root cause 3/3 and an honest 无法确认 3/3, vs terra 2/3
    # and 0/3). This field is ours to set, not the deployer's; the values below are inert until enabled.
    model: "modelverse,deepseek-v4-pro"
    timeout: "12m"                     # 5m truncates a heavy diagnosis mid-run, and the symptom reads as model failure

  # 0 or omitted uses the built-in defaults for llm / mutating /
  # read_expensive. The user_turn_* and max_tokens_per_turn fields are
  # OPT-IN test-phase guardrails — 0 / omitted = no enforcement (NOT
  # promoted to a default). All counters are in-memory per process:
  # a pod restart resets every tenant's daily counter, and N replicas
  # without sticky routing yield an effective cap of N × the value below.
  # For production rollout, replace with a Redis-backed limiter before
  # raising the replica count.
  rate_limit:
    llm_qps: 5
    llm_daily: 5000
    mutating_qps: 1
    mutating_daily: 50
    read_expensive_qps: 6
    read_expensive_daily: 500
    # Per-tenant cap on user-initiated chat turns (one user_message frame
    # = 1 turn; confirm responses and pings do NOT count).
    user_turn_qps: 2      # max 2 messages/sec per tenant; 0 = no QPS cap
    user_turn_daily: 50   # 0 = no daily cap; per-tenant production cap (was 30 in test phase)
    # Per-turn cap on total LLM tokens (prompt + completion summed across
    # every LLM call in one user turn). 0 = no cap. 150000 gives headroom
    # for heavy multi-tool diagnosis turns AND multi-turn sessions where the
    # prior-text/history accumulation inflates input on otherwise-simple
    # follow-ups (the 80000 cap was tripping those, fully refusing answerable
    # questions). When the cap IS hit mid-turn, the engine now synthesizes a
    # grounded answer from any evidence already retrieved instead of returning
    # a bare "请简化问题";
    # it only refuses when no evidence is in hand. Observe
    # trace.outcome.total_tokens and tighten once steady-state is known.
    # 200000 -> 400000 (2026-07-23): raised together with the per-turn agent
    # budgets (ReAct rounds 10->16, SearchKnowledge calls 2->4, retrievals ->8,
    # read-expensive 20->30). Those budgets are the ones the agent spends
    # deliberately; this is the backstop that stops a pathological turn, and at
    # 200000 it would have become the binding constraint on exactly the
    # multi-hop turns the other raises are meant to enable. Still enforced at
    # ReAct iteration boundaries, and hitting it still synthesizes from the
    # evidence already retrieved rather than refusing outright.
    max_tokens_per_turn: 400000

  # HTTP service settings (used by: compshare-agent server).
  # write_timeout must be 0 for SSE streaming connections.
  http:
    listen_addr: "0.0.0.0:7429"
    read_timeout: "30s"
    write_timeout: "0s"
    sse_keepalive_interval: "15s"
    max_input_length: 4000
    pool_capacity: 200
    pool_idle_ttl: "30m"
    # Compatibility-path setting only. After the coordinated durable cutover,
    # conversations continue from committed history and do not roll to an empty
    # session after 10 turns. Until then, the legacy path still uses this cap.
    max_session_turns: 10
    # Skip the built-in CORS middleware. Default false = agent emits
    # Access-Control-Allow-* headers itself (needed when the front-end dev
    # server on localhost:3000 fetches 127.0.0.1:<port> directly per the
    # front-back-local-debug skill). In production set this to true so the
    # console gateway is the SOLE source of CORS headers — otherwise both
    # agent and gateway add them and the browser rejects the duplicate.
    disable_cors: true

  # PostgreSQL backing store (used by: compshare-agent server). The config key
  # `mysql` is kept for compatibility; the value is a libpq URL, e.g.
  # postgresql://user:pass@host:5432/db?sslmode=disable.
  mysql:
    dsn: "postgresql://root:U3JSFCnwt5dfcC5f@117.50.198.43:5432/postgres?sslmode=disable"
    max_open_conns: 20
    max_idle_conns: 5
    conn_max_lifetime: "1h"

  # Static metadata returned by GetMeta action.
  # max_input_length should match http.max_input_length.
  meta:
    welcome: "我是 Compshare Copilot，可以问我控制台相关问题。"
    suggested_prompts:
      - "我有哪些实例"
      - "4090 现在有库存吗"
      - "创建实例的操作步骤"
    max_input_length: 4000

  # OCR / 截图理解。用于 SendCSAgentChat 携带 Image 字段时，调 VL 模型
  # 生成结构化截图解读（场景 + 关键信息 + 错误与可能原因）。结果作为
  # 上下文注入对话，不替代用户问题；只解读不开修复药方（修复由助手结合知识库回答）。
  # model 留空时会读取 MODELVERSE_QWEN_VL_MODEL；二者都空则关闭该功能。
  # base_url 和 api_key 留空时继承 agent.llm 的值。
  ocr:
    model: "qwen3-vl-flash"   # VL model for screenshot OCR / multimodal diagnosis; env fallback: MODELVERSE_QWEN_VL_MODEL
    base_url: ""           # inherits from agent.llm.base_url
    api_key: "Q1J7v8S9PewEW16c2e84171e-cBb5-4763-929D-6c03Fe44"               # qwen3-authorized retrieval key: the terra answer key CANNOT call qwen3-vl-*
    prompt: ""             # 留空=用内置结构化解读提示词(场景/关键信息/错误与可能原因)；设置可改写为更针对性的解读，如训练报错诊断
    timeout: "15s"
    max_bytes: 5242880     # 5MB

  # STS (Security Token Service) credential settings (used by: compshare-agent server).
  # service_ak/service_sk are the long-term service credentials used to mint
  # short-lived STS tokens for per-user API calls. Leave them empty to use
  # legacy direct AK/SK fallback before STS permission is granted.
  # default_role_urn is optional; when set it overrides the per-request role derivation.
  sts:
    service_ak: "A4r4q1hNPGc1vxPhjuHO8S11INY"
    service_sk: "JhHiw05TOhdFGerfDcLZ3pK3CyxOYvhgZJp7K3TAVZSx"
    url: "https://api.ucloud.cn/"
    role_urn_template: "ucs:iam::%d:role/ucs-service-role/ServiceRoleForCompshare"
    default_session_name: "agent-cli"
    duration_seconds: 3600
    refresh_before: "5m"
    # iam_url: internal UCloud API gateway used to auto-provision the
    # ServiceRoleForCompshare service-linked role per tenant when the STS
    # AssumeRole call returns RoleNotExist (11277). Without this, every new
    # tenant has to be onboarded manually in IAM before they can use the
    # service. Reachable only from the UCloud private network — the gateway
    # routes by the request body's Backend field (UAccount), so the path is
    # just "/". Same endpoint used by uhost-extension's stop_scheduler.
    #   prod    : http://internal.api.ucloud.cn
    #   test03  : http://internal-api-test03.service.ucloud.cn
    # Leave empty to disable the bootstrap (RoleNotExist surfaces as-is).
    iam_url: "http://internal.api.ucloud.cn"
