# GitLab CI/CD for compshare-agent. It follows the compshare-kb delivery path:
# test on the c5 runner, build an immutable Kaniko image, then require an
# explicit approval before changing production.
#
# Configure protected CI variables UHUB_USER and UHUB_PASS. The deployment
# runner must already be authorized for prj-ucompshare-prod, and the namespace
# must contain the regcred image-pull secret.

stages:
  - diagnose
  - test
  - knowledge
  - build
  - deploy

variables:
  IMAGE: uhub.service.ucloud.cn/ucompshare-job/compshare-agent
  KB_BUILD_IMAGE: uhub.service.ucloud.cn/ucompshare-job/compshare-kb-build
  GOPROXY: https://goproxy.cn,direct
  # The upstream documentation site. Read-only; the pipeline never writes here.
  COMPSHARE_DOCS_URL: https://git.ucloudadmin.com/www/compshare-docs.git
  # One fixed branch, deliberately. A second failing tick must update the same
  # merge request rather than opening a second one, so there is exactly one
  # place to look and no queue of stale candidates to triage.
  KB_CANDIDATE_BRANCH: auto/knowledge-candidate

# A read-only production diagnostic path. It is optional so it never blocks a
# release, but makes a failed rollout observable without copying KUN access to
# a workstation.
diagnose-production:
  stage: diagnose
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    APP: compshare-agent
  script:
    - kubectl -n "$NAMESPACE" get deployment/"$APP" -o wide
    - kubectl -n "$NAMESPACE" get pods -l app="$APP" -o wide
    - kubectl -n "$NAMESPACE" get service/"$APP" -o wide
    - |
      POD=$(kubectl -n "$NAMESPACE" get pods -l app="$APP" -o jsonpath='{.items[0].metadata.name}')
      if test -n "$POD"; then
        kubectl -n "$NAMESPACE" describe pod "$POD"
        kubectl -n "$NAMESPACE" get pod "$POD" -o jsonpath='{range .status.containerStatuses[*]}{.name}{" ready="}{.ready}{" restarts="}{.restartCount}{" waiting="}{.state.waiting.reason}{" terminated="}{.state.terminated.reason}{" exit="}{.state.terminated.exitCode}{"\n"}{end}'
        kubectl -n "$NAMESPACE" get events --field-selector "involvedObject.name=$POD" --sort-by='.lastTimestamp' || true
        for PREVIOUS in "" "--previous"; do
          kubectl -n "$NAMESPACE" logs "$POD" -c "$APP" $PREVIOUS --tail=200 2>&1 \
            | sed -E \
                -e 's#(wss?|https?)://[^[:space:]]+#<redacted-url>#g' \
                -e 's#(postgres(ql)?://)[^[:space:]]+#\1<redacted-dsn>#g' \
                -e 's#([Tt]oken|[Ss]ecret|[Pp]assword|[Aa]pi[_-]?[Kk]ey)[=:][^[:space:],]+#\1=<redacted>#g' \
            | grep -Ei 'startup:|runtime:|knowledge:|durable turns|ocr enabled|confirm form|guided create|ssh-ops|warning:|error|fatal|panic|schema|postgres|database|listen|server' \
            | cut -c1-1000 || true
        done
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true

# Destructive production cleanup is deliberately an explicit manual action.
# It removes only this workload's controllers and their Pods; the Service and
# database are retained so an approved deploy can recreate the workload.
cleanup-production:
  stage: diagnose
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    APP: compshare-agent
  script:
    - kubectl -n "$NAMESPACE" delete deployment/"$APP" --ignore-not-found --wait=true
    - kubectl -n "$NAMESPACE" delete statefulset/"$APP" --ignore-not-found --wait=true
    - |
      if kubectl -n "$NAMESPACE" get deployment/"$APP" >/dev/null 2>&1; then
        echo "deployment/$APP still exists after cleanup" >&2
        exit 1
      fi
      if kubectl -n "$NAMESPACE" get statefulset/"$APP" >/dev/null 2>&1; then
        echo "statefulset/$APP still exists after cleanup" >&2
        exit 1
      fi
      # Controller deletion is asynchronous.  Give Kubernetes up to three
      # minutes to finish the Pod's configured grace period before treating a
      # remaining Pod as a cleanup failure.
      attempt=0
      while kubectl -n "$NAMESPACE" get pods -l app="$APP" -o name | grep -q .; do
        attempt=$((attempt + 1))
        if test "$attempt" -ge 60; then
          echo "Pods for $APP still exist after controller cleanup" >&2
          kubectl -n "$NAMESPACE" get pods -l app="$APP" -o wide
          exit 1
        fi
        sleep 3
      done
      kubectl -n "$NAMESPACE" get service/"$APP" -o name
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  # Optional maintenance action: merely being present must not block normal
  # test/build/deploy pipelines. A triggered cleanup still reports its own
  # success or failure in the job status.
  allow_failure: true
  environment:
    name: production
    action: stop

test:
  stage: test
  image: uhub.service.ucloud.cn/ucompshare-job/golang:1.25-alpine
  tags:
    - uaek-c5
  # SSH-ops supervisor tests launch the configured Python executable.  The
  # KB's Go-only test suite does not need it, but this Alpine image provides
  # only python3 after installation.
  before_script:
    - apk add --no-cache python3
    - ln -sf /usr/bin/python3 /usr/local/bin/python
  script:
    - go test ./...
    - go vet ./...
  rules:
    # Excluded from scheduled pipelines. A schedule here means one thing -- the
    # knowledge tick -- and it runs on an unchanged main commit whose Go code
    # this job already tested when it merged. Letting it re-run would spend a
    # runner every tick to re-prove the same tree.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'

build:
  stage: build
  image:
    name: uhub.service.ucloud.cn/ucompshare-job/kaniko-executor:debug
    entrypoint: [""]
  tags:
    - uaek-c5
  variables:
    DOCKER_CONFIG: $CI_PROJECT_DIR/.docker
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - |
      AUTH=$(printf "%s:%s" "$UHUB_USER" "$UHUB_PASS" | base64 | tr -d '\n')
      printf '{"auths":{"uhub.service.ucloud.cn":{"auth":"%s"}}}\n' "$AUTH" > "$DOCKER_CONFIG/config.json"
    - |
      if [ -n "${FEISHU_EXTERNAL_IMAGE_OAUTH_BOOTSTRAP_TOKEN:-}" ]; then
        case "$FEISHU_EXTERNAL_IMAGE_OAUTH_BOOTSTRAP_TOKEN" in
          *[!A-Za-z0-9._-]*)
            echo "FEISHU_EXTERNAL_IMAGE_OAUTH_BOOTSTRAP_TOKEN has an unsupported format" >&2
            exit 1
            ;;
        esac
        sed -i "s|^\\([[:space:]]*bootstrap_refresh_token:[[:space:]]*\\).*|\\1\\\"${FEISHU_EXTERNAL_IMAGE_OAUTH_BOOTSTRAP_TOKEN}\\\"|" deploy/conf/config.local.yaml
        echo "Feishu external-image OAuth bootstrap token injected for this image build"
      else
        echo "No Feishu OAuth bootstrap token supplied; this image expects a previously stored encrypted token"
      fi
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "GOPROXY=$GOPROXY"
      --build-arg "VCS_REF=$CI_COMMIT_SHA"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$IMAGE:latest"
  rules:
    # Never on a schedule: a knowledge tick changes the corpus, not the service,
    # and this job moves the `latest` tag. Rebuilding and retagging the runtime
    # image on a corpus tick would make an unrelated deploy look like a change.
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'

# ---------------------------------------------------------------------------
# Docs-driven knowledge releases
#
# A scheduled pipeline asks one question -- has compshare-docs moved since the
# corpus was built -- and on almost every tick the answer is no and nothing
# happens. When it has moved, the corpus is rebuilt, the release gate records a
# verdict, and a merge request is opened for a human.
#
# NOTHING here publishes. Phase 2 runs the gate in SHADOW: it evaluates every
# candidate a person still approves and never fails the pipeline, because the
# thresholds it would block on have no base rate yet. Auto-merge and
# auto-publish are Phase 3, and they are gated on the gate having been observed
# both agreeing with the human and demonstrably red on a broken candidate.
#
# Required CI variables (protected, masked):
#   COMPSHARE_DOCS_TOKEN      read access to www/compshare-docs
#   KB_BUILD_MODELVERSE_KEY   a ModelVerse key authorized for ALL of
#                             Qwen/Qwen3-VL-235B-A22B-Instruct (captions),
#                             qwen3.7-max (semantic splits) and
#                             qwen3-embedding-8b (sidecars). This is the
#                             retrieval-side key, not the terra answer key --
#                             the terra key is scoped to terra alone.
#   KB_CANDIDATE_TOKEN        push to this project + create merge requests
#
# Cadence is bounded by git, not by build cost. Every release rewrites the
# embedding sidecars in full: measured on the shipped artifacts they are
# 60.2 MB external + 26.6 MB internal raw, 15.3 + 6.8 MB as git stores them.
# Holding the external date back (--external-valid-from) keeps the external
# sidecar's filename and bytes identical, so a docs-only release costs ~7.4 MB
# of history instead of ~23.8 MB. Weekly is ~30 MB/month; a tick per docs
# commit would be up to ~290 MB/month even with that saving, so if the cadence
# is ever raised, move the sidecars out of git first.
# ---------------------------------------------------------------------------

# The cheap half. It runs on the kubectl image because reading the ACTIVE
# release id needs the cluster, and it exists as its own job so the common case
# -- docs unchanged -- never pulls the multi-hundred-MB build image at all.
knowledge-tick:
  stage: knowledge
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    KB_STATEFULSET: compshare-kb
  before_script:
    - apk add --no-cache git python3
  script:
    - |
      set -eu

      # The token never reaches argv or the process table. GitLab masks
      # protected variables in the log, but a credentials file keeps it out of
      # `ps` on a shared runner as well.
      umask 077
      printf 'https://oauth2:%s@git.ucloudadmin.com\n' "$COMPSHARE_DOCS_TOKEN" \
        > "$HOME/.git-credentials"
      git config --global credential.helper store

      # The revision the CORPUS was built from, read out of the artifact that
      # recorded it rather than restated anywhere. release_inputs is stdlib-only
      # precisely so this job can run it on `apk add python3`.
      PINNED=$(python3 -m scripts.rag_v2.release_inputs \
        pinned-docs-revision deploy/kb/v2/release_manifest.json)
      HEAD_REV=$(git ls-remote "$COMPSHARE_DOCS_URL" HEAD | cut -f1)
      test -n "$HEAD_REV"
      echo "corpus was built from $PINNED; compshare-docs HEAD is $HEAD_REV"

      if [ "$PINNED" = "$HEAD_REV" ]; then
        echo "docs unchanged -- nothing to build"
        printf 'KB_TICK_WORK=none\n' > tick.env
        exit 0
      fi

      # The candidate must declare the release its corpus is built ON, and that
      # value can only come from the process that is serving it. Read here, in
      # the job that already has cluster access, and carried forward -- the
      # build job neither needs nor gets kubectl.
      HEALTHZ=$(kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- \
        wget -qO- http://127.0.0.1:8088/healthz)
      ACTIVE=$(printf '%s' "$HEALTHZ" | sed -n 's/.*"release_id":"\([^"]*\)".*/\1/p')
      test -n "$ACTIVE"
      echo "production is serving $ACTIVE"

      printf 'KB_TICK_WORK=build\nKB_DOCS_PINNED=%s\nKB_DOCS_HEAD=%s\nKB_PARENT_RELEASE_ID=%s\n' \
        "$PINNED" "$HEAD_REV" "$ACTIVE" > tick.env
  artifacts:
    reports:
      dotenv: tick.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $KB_AUTO_BUILD == "1"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# The expensive half. Only the work the docs change touched is redone --
# captions are keyed on image bytes, semantic plans on section text and vectors
# on chunk content, and all three caches are committed, so a cold runner makes
# roughly the same number of model calls as a warm laptop.
build-knowledge-candidate:
  stage: build
  image: $KB_BUILD_IMAGE:latest
  tags:
    - uaek-c5
  needs:
    - job: knowledge-tick
      artifacts: true
  timeout: 3h
  # One candidate at a time. Two concurrent builds would race on the same fixed
  # branch and each would force-push the other's work away.
  resource_group: kb-candidate
  script:
    - |
      set -eu
      if [ "${KB_TICK_WORK:-none}" != "build" ]; then
        echo "knowledge-tick found nothing to do"
        exit 0
      fi
      test -n "${KB_DOCS_HEAD:-}"
      test -n "${KB_PARENT_RELEASE_ID:-}"

      WORK=$(mktemp -d)
      umask 077
      printf 'https://oauth2:%s@git.ucloudadmin.com\n' "$COMPSHARE_DOCS_TOKEN" \
        > "$HOME/.git-credentials"
      git config --global credential.helper store
      git config --global user.email "compshare-agent-ci@ucloud.cn"
      git config --global user.name "compshare-agent CI"

      # The RELEASED bytes, snapshotted before anything overwrites them. Same
      # premise release.py's own snapshot_released uses: what production
      # imported is what is in this checkout, not what some git revision says.
      mkdir -p "$WORK/released"
      cp deploy/kb/stage2b_w0.jsonl "$WORK/released/"
      cp deploy/kb/external_w0.jsonl "$WORK/released/"
      cp deploy/kb/v2/release_manifest.json "$WORK/released/"

      # A full clone; 761 commits is nothing, and a shallow one cannot answer
      # what changed between the pinned revision and HEAD.
      git clone --quiet "$COMPSHARE_DOCS_URL" "$WORK/compshare-docs"
      git -C "$WORK/compshare-docs" checkout --quiet "$KB_DOCS_HEAD"

      # Refuse a history that was rewritten under us. Without this the diff is
      # still computable and still looks reasonable while describing a
      # ROLLBACK -- which is exactly how one investigation in this repo came to
      # report 29 upserts for a revision that was an ancestor of the pin.
      if ! git -C "$WORK/compshare-docs" merge-base --is-ancestor \
           "$KB_DOCS_PINNED" "$KB_DOCS_HEAD"; then
        echo "$KB_DOCS_PINNED is not an ancestor of $KB_DOCS_HEAD." >&2
        echo "compshare-docs history was rewritten; a human has to decide what this release means." >&2
        exit 1
      fi

      # --no-renames on purpose: rename detection reports only the new path,
      # and attribution needs BOTH sides -- a moved document is a removed
      # document plus an added one in the corpus, and the removed half has to
      # be explainable too.
      git -C "$WORK/compshare-docs" diff --no-renames --name-only \
        "$KB_DOCS_PINNED" "$KB_DOCS_HEAD" > "$WORK/docs_diff.txt"
      echo "docs changed $(wc -l < "$WORK/docs_diff.txt") paths"

      # Fails in seconds, naming the file, instead of after the VL budget is
      # spent: collect_internal_docs raises on an MDX component the cleaner has
      # never seen, and that is the single most common way a docs change breaks
      # this build.
      python -c 'import pathlib, sys; from scripts.rag_v2 import pipeline; print("MDX pre-check ok:", len(pipeline.collect_internal_docs(pathlib.Path(sys.argv[1]))), "platform documents")' "$WORK/compshare-docs"

      printf 'MODELVERSE_API_KEY=%s\n' "$KB_BUILD_MODELVERSE_KEY" > "$WORK/build.env"

      # The external corpus keeps the date it already has. Nothing about the
      # external snapshots changed -- G2 asserts their ZIP digests are
      # identical -- so restamping them would rewrite 3.7 MB of corpus and a
      # 60 MB sidecar to say a different date, and would make G4's "the
      # partitions with no reviewer did not move" impossible to satisfy.
      EXTERNAL_VALID_FROM=$(python -m scripts.rag_v2.release_inputs \
        corpus-valid-from deploy/kb/external_w0.jsonl)
      VALID_FROM=$(date -u -d '+8 hours' +%Y-%m-%d 2>/dev/null || date -u +%Y-%m-%d)
      echo "internal valid_from=$VALID_FROM, external held at $EXTERNAL_VALID_FROM"

      # Every argument spelled out here rather than defaulted, because the
      # absence of --skip-vl / --skip-semantic / --allow-stale-remote is a
      # safety property and an unattended build must not be able to acquire one
      # by inheriting it from somewhere else. build.py records this argv into
      # release_manifest.json and the gate reads it back.
      python -m scripts.rag_v2.release \
        --env "$WORK/build.env" \
        --parent-release-id "$KB_PARENT_RELEASE_ID" \
        --build-arg --internal-docs --build-arg "$WORK/compshare-docs" \
        --build-arg --internal-revision --build-arg "$KB_DOCS_HEAD" \
        --build-arg --faq-zip --build-arg 'deploy/kb/v2/sources/优云智算模型套餐FAQ.zip' \
        --build-arg --faq-zip --build-arg 'deploy/kb/v2/sources/ComfyUI基础镜像常见问题解答（持续更新中）.zip' \
        --build-arg --faq-zip --build-arg 'deploy/kb/v2/sources/优云智算使用问题FAQ.zip' \
        --build-arg --external-zip --build-arg 'deploy/kb/v2/sources/comfyui-mirror-docs.zip' \
        --build-arg --external-zip --build-arg 'deploy/kb/v2/sources/digital-human-docs.zip' \
        --build-arg --external-zip --build-arg 'deploy/kb/v2/sources/voice-audio-docs.zip' \
        --build-arg --legacy-external --build-arg deploy/kb/v2/legacy_external_lock.jsonl \
        --build-arg --valid-from --build-arg "$VALID_FROM" \
        --build-arg --external-valid-from --build-arg "$EXTERNAL_VALID_FROM"

      # Its own process with its own exit code. release_diff is called as a
      # function by release.py and its return value is discarded there, so a
      # verdict living inside it would be a no-op -- which is how this tree
      # already shipped one gate that could not fail.
      python -m scripts.rag_v2.release_gate \
        --release-dir deploy/kb/v2 \
        --released-internal "$WORK/released/stage2b_w0.jsonl" \
        --released-external "$WORK/released/external_w0.jsonl" \
        --released-manifest "$WORK/released/release_manifest.json" \
        --docs-diff "$WORK/docs_diff.txt" \
        --mode "${KB_GATE_MODE:-shadow}" \
        --out-md deploy/kb/v2/release_gate.md \
        --out-json deploy/kb/v2/release_gate.json

      rm -rf "$WORK/compshare-docs" "$WORK/build.env"

      # A branch, a force-push and at most one merge request. A human merges it;
      # merging is what triggers import-knowledge-release, which is still manual.
      git add -A deploy/kb internal/knowledge/corpus_digest.go
      if git diff --cached --quiet; then
        echo "docs moved but the corpus did not change; nothing to propose"
        exit 0
      fi
      # Built with printf into a file rather than a multi-line -m: a here-doc or
      # an embedded newline would have to sit at column 0 to keep its shape, and
      # column 0 ends the YAML block scalar this whole script lives in.
      {
        printf 'chore(kb): rebuild corpus for compshare-docs %s\n\n' "$KB_DOCS_HEAD"
        printf 'compshare-docs %s -> %s\n' "$KB_DOCS_PINNED" "$KB_DOCS_HEAD"
        printf 'built on release %s\n' "$KB_PARENT_RELEASE_ID"
        printf 'internal valid_from %s, external held at %s\n\n' "$VALID_FROM" "$EXTERNAL_VALID_FROM"
        printf 'Gate verdict: deploy/kb/v2/release_gate.md (shadow -- records, does not block).\n'
        printf 'Reviewable diff: deploy/kb/v2/release_diff.md\n'
      } > "$WORK/commit.txt"
      git commit --quiet -F "$WORK/commit.txt"
      git push --force \
        "https://oauth2:${KB_CANDIDATE_TOKEN}@git.ucloudadmin.com/${CI_PROJECT_PATH}.git" \
        "HEAD:refs/heads/${KB_CANDIDATE_BRANCH}"

      OPEN=$(curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: $KB_CANDIDATE_TOKEN" \
        "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/merge_requests?state=opened&source_branch=${KB_CANDIDATE_BRANCH}" \
        | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
      if [ "$OPEN" = "0" ]; then
        # --form-string, not --form: curl's --form reads a value beginning with
        # @ or < as a FILENAME, and the description is a generated markdown
        # table whose first character is not something this job controls.
        curl --fail --silent --show-error --request POST \
          --header "PRIVATE-TOKEN: $KB_CANDIDATE_TOKEN" \
          --form-string "source_branch=${KB_CANDIDATE_BRANCH}" \
          --form-string "target_branch=main" \
          --form-string "title=chore(kb): 知识库语料随 compshare-docs 更新" \
          --form-string "description=$(head -60 deploy/kb/v2/release_gate.md)" \
          "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/merge_requests" > /dev/null
        echo "opened a merge request for ${KB_CANDIDATE_BRANCH}"
      else
        echo "merge request for ${KB_CANDIDATE_BRANCH} already open; force-pushed into it"
      fi
  artifacts:
    paths:
      - deploy/kb/v2/release_gate.md
      - deploy/kb/v2/release_gate.json
      - deploy/kb/v2/release_diff.md
      - deploy/kb/v2/asset_report.json
    expire_in: 90 days
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $KB_AUTO_BUILD == "1"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# Rebuilt only when its inputs move. It pins a 3.12 interpreter and the render
# dependencies the caption contract attests to, and asserts both at image-build
# time so a broken image fails at pull rather than at the end of a release.
build-kb-build-image:
  stage: build
  image:
    name: uhub.service.ucloud.cn/ucompshare-job/kaniko-executor:debug
    entrypoint: [""]
  tags:
    - uaek-c5
  variables:
    DOCKER_CONFIG: $CI_PROJECT_DIR/.docker
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - |
      AUTH=$(printf "%s:%s" "$UHUB_USER" "$UHUB_PASS" | base64 | tr -d '\n')
      printf '{"auths":{"uhub.service.ucloud.cn":{"auth":"%s"}}}\n' "$AUTH" > "$DOCKER_CONFIG/config.json"
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile.kb-build"
      --destination "$KB_BUILD_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$KB_BUILD_IMAGE:latest"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Dockerfile.kb-build
        - scripts/rag_v2/requirements.txt
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# The external-group screenshot reader persists a rotating Feishu user token.
# Its table is a separate, explicit production change: operators trigger this
# job from GitLab before enabling agent.feishu.external_image_oauth. It uses the
# existing migration helper and never prints the database URL or token values.
migrate-feishu-oauth:
  stage: deploy
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
  script:
    - |
      set -eu
      POD="compshare-agent-migrate-feishu-oauth-${CI_PIPELINE_ID}"
      cleanup() {
        kubectl -n "$NAMESPACE" delete pod "$POD" --ignore-not-found --wait=false >/dev/null 2>&1 || true
      }
      trap cleanup EXIT
      sed \
        -e "s|__IMAGE__|$IMAGE:$CI_COMMIT_SHORT_SHA|g" \
        -e "s|__POD_NAME__|$POD|g" \
        deploy/k8s/migration-pod.yaml \
        | kubectl -n "$NAMESPACE" apply -f -
      attempt=0
      while :; do
        phase=$(kubectl -n "$NAMESPACE" get pod "$POD" -o jsonpath='{.status.phase}')
        case "$phase" in
          Succeeded)
            kubectl -n "$NAMESPACE" logs "$POD" -c migrate --tail=200
            exit 0
            ;;
          Failed)
            kubectl -n "$NAMESPACE" logs "$POD" -c migrate --tail=200 || true
            exit 1
            ;;
        esac
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 150 ]; then
          kubectl -n "$NAMESPACE" logs "$POD" -c migrate --tail=200 || true
          echo "migration pod timed out" >&2
          exit 1
        fi
        sleep 2
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production

# Publish the corpus under deploy/kb/ as the active compshare-kb release.
#
# This repository is the only place where the corpus and cluster access already
# coexist: compshare-kb owns the database and the worker binary but does not
# carry the artifacts, and the artifacts are committed here.  Nothing else
# writes knowledge into production -- the serving process only reads, and the
# MCP update tools take at most twenty hand-authored chunks per call -- so
# without this job a rebuilt corpus stays in git and production keeps answering
# from the previous release.
#
# Deploying compshare-kb does NOT run this.  The two are independent: a deploy
# swaps the image and leaves the corpus alone; this swaps the corpus and leaves
# the image alone.
#
# If the worker creates the release but publication fails, re-running is
# rejected by the release id's primary key rather than silently importing
# twice.  Recover by publishing the existing candidate instead:
#   kubectl -n prj-ucompshare-prod exec compshare-kb-0 -- \
#     /usr/local/bin/compshare-kb-worker --action publish --release-id <id>
import-knowledge-release:
  stage: deploy
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    KB_STATEFULSET: compshare-kb
    KB_RELEASE_ID: kb-release-$CI_COMMIT_SHORT_SHA
    KB_RELEASE_VERSION: kb.compshare.$CI_COMMIT_SHORT_SHA
  # Two imports from different commits must not interleave. Job A's candidate
  # insert plus corpus load takes real time, and with import and publish now
  # separate, an overlapping run is the one way a stale candidate can end up
  # published over a newer one from this side. (The server-side guard is the
  # worker's base-match; this only stops the races we ourselves start.)
  resource_group: kb-import
  script:
    - |
      set -eu
      POD="compshare-kb-import-${CI_PIPELINE_ID}"
      CP_LIST="/tmp/kb-cp-files-${CI_PIPELINE_ID}"
      cleanup() {
        kubectl -n "$NAMESPACE" delete pod "$POD" --ignore-not-found --wait=false >/dev/null 2>&1 || true
        rm -f "$CP_LIST"
      }
      trap cleanup EXIT

      # The worker's arguments are accumulated in the POSITIONAL PARAMETERS, not
      # in a string.  A string would have to be expanded unquoted to become an
      # argument list, and one of its values -- the parent release id -- is read
      # out of a committed JSON file, so an unquoted expansion lets that file
      # decide the worker's argv: a `parent_release_id` of "r0 --publish" would
      # word-split into a --publish this job deliberately never passes, turning
      # the candidate-then-review gate into a publish.  `set --` appends whole
      # arguments, so a value containing spaces stays one argument and fails the
      # base-match comparison instead of becoming a flag.
      set --
      # Pair each corpus with its sidecar through the digest the sidecar
      # filename carries.  No digest is restated here: a regenerated or
      # renamed artifact fails this loop instead of importing a vector set
      # built for different text, and the worker re-checks the same bijection
      # server-side.  The \r strip makes the hash match on a CRLF checkout too.
      : > "$CP_LIST"
      for corpus in stage2b_w0 external_w0; do
        test -f "deploy/kb/$corpus.jsonl"
        digest=$(tr -d '\r' < "deploy/kb/$corpus.jsonl" | sha256sum | cut -d' ' -f1)
        sidecar="deploy/kb/embeddings_${digest}_qwen3-embedding-8b.jsonl"
        if ! test -f "$sidecar"; then
          echo "no embedding sidecar for deploy/kb/$corpus.jsonl (corpus digest $digest)" >&2
          exit 1
        fi
        echo "$corpus.jsonl $(wc -c < "deploy/kb/$corpus.jsonl") bytes -> $(basename "$sidecar") $(wc -c < "$sidecar") bytes"
        printf '%s\n%s\n' "deploy/kb/$corpus.jsonl" "$sidecar" >> "$CP_LIST"
        set -- "$@" --corpus "/work/$corpus.jsonl" --embeddings "/work/$(basename "$sidecar")"
      done

      # Read the two settings that decide WHERE this release lands out of the
      # serving process itself, rather than restating them or re-deriving them
      # from the manifest: this is the value the query plane is actually using,
      # and it stays correct if either one later moves into the Secret.  A wrong
      # knowledge-base name is the one failure mode with no symptom -- the
      # import succeeds, /healthz keeps reporting the old version, and nothing
      # logs a complaint.
      serving_env() {
        kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- printenv "$1" || true
      }
      POSTGRES_HOST=$(serving_env COMPSHARE_KB_POSTGRES_HOST)
      KNOWLEDGE_BASE=$(serving_env COMPSHARE_KB_KNOWLEDGE_BASE)
      test -n "$POSTGRES_HOST"
      test -n "$KNOWLEDGE_BASE"

      # The import binary validates the bundle the serving binary will load, and
      # the rune cap it validates against is a compile-time constant with no
      # runtime surface -- /healthz reports status, release_id and kb_version and
      # nothing else.  So the only available proof that the two agree is that
      # they are the same build.  A floating :latest gave no such proof; this
      # takes the image the StatefulSet is actually running, the same jsonpath
      # the compshare-kb repo's own deploy job checks.
      KB_IMAGE=$(kubectl -n "$NAMESPACE" get pod "${KB_STATEFULSET}-0" -o jsonpath='{.spec.containers[0].image}')
      test -n "$KB_IMAGE"
      echo "importing $KB_RELEASE_VERSION into knowledge base '$KNOWLEDGE_BASE' using $KB_IMAGE"

      # The candidate has to declare the release its corpus was BUILT on, and
      # that claim is checked here against what production is serving right now.
      # Deriving the parent at import time instead would record whatever is live
      # when this job runs -- which is exactly the release the corpus may not
      # have been built on.  Build on R0, let R1 publish while the candidate is
      # on its way, and an import-time read files the candidate as R1's child,
      # so publishing it overwrites content it never saw while the base match
      # reports success.  Checking it now also beats discovering it as a
      # publish-time ErrStaleCandidate, which says nothing about which corpus.
      #
      # release_diff.md is checked HERE rather than after the import, for two
      # reasons.  It is a gate, and a gate that reports after the candidate
      # exists has already let the thing through; and failing now leaves nothing
      # behind, while failing afterwards strands an orphan candidate that the
      # next run's base match has no opinion about.  Both files come from the
      # same `release.py` invocation, so a candidate missing either one was not
      # built by the orchestrated command and nobody can review what changed.
      for required in release_base.json release_diff.md; do
        if ! test -f "deploy/kb/v2/$required"; then
          echo "deploy/kb/v2/$required is missing." >&2
          echo "Build the candidate with: python -m scripts.rag_v2.release --parent-release-id <id> ..." >&2
          exit 1
        fi
      done
      PARENT_RELEASE_ID=$(sed -n 's/^[[:space:]]*"parent_release_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' deploy/kb/v2/release_base.json)
      HEALTHZ=$(kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- wget -qO- http://127.0.0.1:8088/healthz)
      ACTIVE_RELEASE_ID=$(printf '%s' "$HEALTHZ" | sed -n 's/.*"release_id":"\([^"]*\)".*/\1/p')

      if [ -z "$PARENT_RELEASE_ID" ]; then
        if [ -n "$ACTIVE_RELEASE_ID" ]; then
          echo "this corpus records no parent release, but production is serving $ACTIVE_RELEASE_ID." >&2
          echo "Rebuild with: python -m scripts.rag_v2.release --parent-release-id $ACTIVE_RELEASE_ID ..." >&2
          exit 1
        fi
        set -- "$@" --allow-empty-parent
        echo "no active release; importing as the first publication"
      else
        if [ "$PARENT_RELEASE_ID" != "$ACTIVE_RELEASE_ID" ]; then
          echo "this corpus was built on $PARENT_RELEASE_ID, production is serving $ACTIVE_RELEASE_ID." >&2
          echo "Publishing it would overwrite content the corpus never saw.  Rebuild on the" >&2
          echo "current release, or publish the pending candidate first." >&2
          exit 1
        fi
        set -- "$@" --parent-release-id "$PARENT_RELEASE_ID"
        echo "corpus is based on $PARENT_RELEASE_ID, which is what production is serving"
      fi

      sed \
        -e "s|__IMAGE__|$KB_IMAGE|g" \
        -e "s|__POD_NAME__|$POD|g" \
        -e "s|__POSTGRES_HOST__|$POSTGRES_HOST|g" \
        -e "s|__KNOWLEDGE_BASE__|$KNOWLEDGE_BASE|g" \
        deploy/k8s/kb-import-pod.yaml \
        | kubectl -n "$NAMESPACE" apply -f -

      attempt=0
      until [ "$(kubectl -n "$NAMESPACE" get pod "$POD" -o jsonpath='{.status.phase}')" = "Running" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 60 ]; then
          kubectl -n "$NAMESPACE" describe pod "$POD" || true
          echo "import pod did not reach Running" >&2
          exit 1
        fi
        sleep 5
      done

      # Redirected, not piped: a `cmd | while` body runs in a subshell, where
      # `exit 1` on a short copy would end the subshell and let the import go
      # ahead on a truncated corpus.
      while IFS= read -r file; do
        base=$(basename "$file")
        echo "copying $base"
        kubectl -n "$NAMESPACE" cp "$file" "$POD:/work/$base"
        want=$(wc -c < "$file")
        got=$(kubectl -n "$NAMESPACE" exec "$POD" -- sh -c "wc -c < '/work/$base'" | tr -d '[:space:]')
        if [ "$want" != "$got" ]; then
          echo "$base copied as $got bytes, expected $want" >&2
          exit 1
        fi
      done < "$CP_LIST"

      # "$@" carries the corpus/sidecar pairs and the base-match argument built
      # above, each as one whole argument.  No --publish: --validate already
      # defaults to true, so this leaves a VALIDATED CANDIDATE and does not touch
      # the active pointer.  Nothing a user sees changes until
      # publish-knowledge-release is run, and --require-base-match (default true)
      # makes that later publish a compare-and-swap against the parent recorded
      # above.
      kubectl -n "$NAMESPACE" exec "$POD" -- /usr/local/bin/compshare-kb-worker \
        --action import \
        --knowledge-base "$KNOWLEDGE_BASE" \
        --release-id "$KB_RELEASE_ID" \
        --version "$KB_RELEASE_VERSION" \
        "$@"

      echo
      echo "candidate $KB_RELEASE_ID imported and validated; the active release is UNCHANGED."
      echo "Review deploy/kb/v2/release_diff.md (artifact of this job), then run"
      echo "publish-knowledge-release on this same commit to make it active."
      echo
      echo "----- release_diff.md (head) -----"
      head -40 deploy/kb/v2/release_diff.md
      echo "----- (full report in this job's artifacts) -----"
  artifacts:
    paths:
      - deploy/kb/v2/release_diff.md
      - deploy/kb/v2/asset_report.json
    expire_in: 30 days
    when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    # Not `production`: importing a candidate changes nothing a user can see.
    # Naming it production would record a deployment that did not happen and
    # would make the real one, below, look like a repeat.
    name: production-kb-candidate

# The second half of the gate.  Separate from the import because a candidate
# nobody looked at is not a review, and the import job is where the reviewable
# diff is produced.  This job needs no import Pod, no corpus files and no
# image reference at all: `--action publish` takes only a release id, and it
# runs on the serving pod itself, i.e. on the SHA-pinned binary that will load
# the release.
#
# Rolling back is not automated: a retired release keeps its chunks and vectors
# (nothing deletes them) but no code path re-activates it.  Today that needs
#   UPDATE knowledge.kb_releases SET status='validated' WHERE id='<old-id>';
# followed by this job's worker command with that id -- two transactions, not
# one, so treat it as emergency recovery rather than a supported rollback.
publish-knowledge-release:
  stage: deploy
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    KB_STATEFULSET: compshare-kb
    KB_RELEASE_ID: kb-release-$CI_COMMIT_SHORT_SHA
    KB_RELEASE_VERSION: kb.compshare.$CI_COMMIT_SHORT_SHA
  resource_group: kb-publish
  script:
    - |
      set -eu
      echo "publishing $KB_RELEASE_ID ($KB_RELEASE_VERSION)"

      # Fails loudly if the candidate was never imported or never validated:
      # store.Publish requires status='validated' and refuses anything else.
      kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- \
        /usr/local/bin/compshare-kb-worker \
        --action publish \
        --release-id "$KB_RELEASE_ID"

      # Acceptance is what the SERVING process reports, not what the worker
      # returned: publication only moves a pointer, and the query plane picks it
      # up on its own reload interval.
      attempt=0
      until kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- \
        wget -qO- http://127.0.0.1:8088/healthz | grep -q "\"kb_version\":\"$KB_RELEASE_VERSION\""; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 20 ]; then
          echo "compshare-kb did not start serving $KB_RELEASE_VERSION within ~100s" >&2
          kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- wget -qO- http://127.0.0.1:8088/healthz || true
          kubectl -n "$NAMESPACE" logs "${KB_STATEFULSET}-0" --tail=50 || true
          exit 1
        fi
        sleep 5
      done
      echo "compshare-kb is serving $KB_RELEASE_VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production

deploy:
  stage: deploy
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    APP: compshare-agent
  script:
    - >-
      sed "s|__IMAGE__|$IMAGE:$CI_COMMIT_SHORT_SHA|g"
      deploy/k8s/deployment.yaml
      | kubectl -n "$NAMESPACE" apply -f -
    - kubectl -n "$NAMESPACE" rollout status deployment/"$APP" --timeout=600s
    - kubectl -n "$NAMESPACE" get service/"$APP"
    - |
      POD=$(kubectl -n "$NAMESPACE" get pods -l app="$APP" -o jsonpath='{.items[0].metadata.name}')
      test -n "$POD"
      # The Pod is already Ready by this point -- rollout status does not return
      # until the readinessProbe in deploy/k8s/deployment.yaml has had 200 from
      # /healthz on the Pod IP -- so what this checks is the SERVICE: DNS, the
      # selector, targetPort, and the round trip back to the only endpoint.
      #
      # That path is not ready the instant rollout status returns. EndpointSlice
      # and kube-proxy lag it by a second or two, and strategy: Recreate has
      # already removed the old Pod, so the ClusterIP briefly has no endpoint at
      # all and iptables DROPs the packets -- a connect timeout, not a refusal.
      # Without a retry the check was red on every deploy that actually replaced
      # the Pod and green on every no-op re-run of the same image tag, which is
      # exactly the wrong way round: pipeline 2516809 reported "deploy failed"
      # for a rollout that had succeeded, and its re-run passed only because
      # apply was "unchanged" and the Pod had been Ready for hours.
      #
      # Retrying rather than switching to 127.0.0.1:7429 is deliberate. The
      # re-run proves the Service round trip works on this cluster, so localhost
      # would drop the selector/targetPort coverage to buy nothing.
      probe() {
        kubectl -n "$NAMESPACE" exec "$POD" -c "$APP" -- python3 -c \
          'import urllib.request; response = urllib.request.urlopen("http://compshare-agent/healthz", timeout=5); assert response.status == 200'
      }
      attempt=0
      until probe >/dev/null 2>&1; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 10 ]; then
          echo "the Service round trip to /healthz did not succeed within ~30s" >&2
          kubectl -n "$NAMESPACE" get endpoints "$APP" -o wide || true
          probe || true
          exit 1
        fi
        sleep 3
      done
      echo "Service round trip to /healthz ok after $attempt retries"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
