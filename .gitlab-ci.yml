# GitLab CI/CD for compshare-agent. It follows the compshare-kb delivery path:
# test on the c5 runner, build an immutable Kaniko image, then require an
# explicit approval before changing production.
#
# Configure protected CI variables UHUB_USER and UHUB_PASS. The deployment
# runner must already be authorized for prj-ucompshare-prod, and the namespace
# must contain the regcred image-pull secret.

stages:
  - diagnose
  - test
  - build
  - deploy

variables:
  IMAGE: uhub.service.ucloud.cn/ucompshare-job/compshare-agent
  GOPROXY: https://goproxy.cn,direct

# A read-only production diagnostic path. It is optional so it never blocks a
# release, but makes a failed rollout observable without copying KUN access to
# a workstation.
diagnose-production:
  stage: diagnose
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    APP: compshare-agent
  script:
    - kubectl -n "$NAMESPACE" get deployment/"$APP" -o wide
    - kubectl -n "$NAMESPACE" get pods -l app="$APP" -o wide
    - kubectl -n "$NAMESPACE" get service/"$APP" -o wide
    - |
      POD=$(kubectl -n "$NAMESPACE" get pods -l app="$APP" -o jsonpath='{.items[0].metadata.name}')
      if test -n "$POD"; then
        kubectl -n "$NAMESPACE" describe pod "$POD"
        kubectl -n "$NAMESPACE" get pod "$POD" -o jsonpath='{range .status.containerStatuses[*]}{.name}{" ready="}{.ready}{" restarts="}{.restartCount}{" waiting="}{.state.waiting.reason}{" terminated="}{.state.terminated.reason}{" exit="}{.state.terminated.exitCode}{"\n"}{end}'
        kubectl -n "$NAMESPACE" get events --field-selector "involvedObject.name=$POD" --sort-by='.lastTimestamp' || true
        for PREVIOUS in "" "--previous"; do
          kubectl -n "$NAMESPACE" logs "$POD" -c "$APP" $PREVIOUS --tail=200 2>&1 \
            | sed -E \
                -e 's#(wss?|https?)://[^[:space:]]+#<redacted-url>#g' \
                -e 's#(postgres(ql)?://)[^[:space:]]+#\1<redacted-dsn>#g' \
                -e 's#([Tt]oken|[Ss]ecret|[Pp]assword|[Aa]pi[_-]?[Kk]ey)[=:][^[:space:],]+#\1=<redacted>#g' \
            | grep -Ei 'startup:|runtime:|knowledge:|durable turns|ocr enabled|confirm form|guided create|ssh-ops|warning:|error|fatal|panic|schema|postgres|database|listen|server' \
            | cut -c1-1000 || true
        done
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true

# Destructive production cleanup is deliberately an explicit manual action.
# It removes only this workload's controllers and their Pods; the Service and
# database are retained so an approved deploy can recreate the workload.
cleanup-production:
  stage: diagnose
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    APP: compshare-agent
  script:
    - kubectl -n "$NAMESPACE" delete deployment/"$APP" --ignore-not-found --wait=true
    - kubectl -n "$NAMESPACE" delete statefulset/"$APP" --ignore-not-found --wait=true
    - |
      if kubectl -n "$NAMESPACE" get deployment/"$APP" >/dev/null 2>&1; then
        echo "deployment/$APP still exists after cleanup" >&2
        exit 1
      fi
      if kubectl -n "$NAMESPACE" get statefulset/"$APP" >/dev/null 2>&1; then
        echo "statefulset/$APP still exists after cleanup" >&2
        exit 1
      fi
      # Controller deletion is asynchronous.  Give Kubernetes up to three
      # minutes to finish the Pod's configured grace period before treating a
      # remaining Pod as a cleanup failure.
      attempt=0
      while kubectl -n "$NAMESPACE" get pods -l app="$APP" -o name | grep -q .; do
        attempt=$((attempt + 1))
        if test "$attempt" -ge 60; then
          echo "Pods for $APP still exist after controller cleanup" >&2
          kubectl -n "$NAMESPACE" get pods -l app="$APP" -o wide
          exit 1
        fi
        sleep 3
      done
      kubectl -n "$NAMESPACE" get service/"$APP" -o name
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  # Optional maintenance action: merely being present must not block normal
  # test/build/deploy pipelines. A triggered cleanup still reports its own
  # success or failure in the job status.
  allow_failure: true
  environment:
    name: production
    action: stop

test:
  stage: test
  image: uhub.service.ucloud.cn/ucompshare-job/golang:1.25-alpine
  tags:
    - uaek-c5
  # SSH-ops supervisor tests launch the configured Python executable.  The
  # KB's Go-only test suite does not need it, but this Alpine image provides
  # only python3 after installation.
  before_script:
    - apk add --no-cache python3
    - ln -sf /usr/bin/python3 /usr/local/bin/python
  script:
    - go test ./...
    - go vet ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build:
  stage: build
  image:
    name: uhub.service.ucloud.cn/ucompshare-job/kaniko-executor:debug
    entrypoint: [""]
  tags:
    - uaek-c5
  variables:
    DOCKER_CONFIG: $CI_PROJECT_DIR/.docker
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - |
      AUTH=$(printf "%s:%s" "$UHUB_USER" "$UHUB_PASS" | base64 | tr -d '\n')
      printf '{"auths":{"uhub.service.ucloud.cn":{"auth":"%s"}}}\n' "$AUTH" > "$DOCKER_CONFIG/config.json"
    - |
      if [ -n "${FEISHU_EXTERNAL_IMAGE_OAUTH_BOOTSTRAP_TOKEN:-}" ]; then
        case "$FEISHU_EXTERNAL_IMAGE_OAUTH_BOOTSTRAP_TOKEN" in
          *[!A-Za-z0-9._-]*)
            echo "FEISHU_EXTERNAL_IMAGE_OAUTH_BOOTSTRAP_TOKEN has an unsupported format" >&2
            exit 1
            ;;
        esac
        sed -i "s|^\\([[:space:]]*bootstrap_refresh_token:[[:space:]]*\\).*|\\1\\\"${FEISHU_EXTERNAL_IMAGE_OAUTH_BOOTSTRAP_TOKEN}\\\"|" deploy/conf/config.local.yaml
        echo "Feishu external-image OAuth bootstrap token injected for this image build"
      else
        echo "No Feishu OAuth bootstrap token supplied; this image expects a previously stored encrypted token"
      fi
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "GOPROXY=$GOPROXY"
      --build-arg "VCS_REF=$CI_COMMIT_SHA"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# The external-group screenshot reader persists a rotating Feishu user token.
# Its table is a separate, explicit production change: operators trigger this
# job from GitLab before enabling agent.feishu.external_image_oauth. It uses the
# existing migration helper and never prints the database URL or token values.
migrate-feishu-oauth:
  stage: deploy
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
  script:
    - |
      set -eu
      POD="compshare-agent-migrate-feishu-oauth-${CI_PIPELINE_ID}"
      cleanup() {
        kubectl -n "$NAMESPACE" delete pod "$POD" --ignore-not-found --wait=false >/dev/null 2>&1 || true
      }
      trap cleanup EXIT
      sed \
        -e "s|__IMAGE__|$IMAGE:$CI_COMMIT_SHORT_SHA|g" \
        -e "s|__POD_NAME__|$POD|g" \
        deploy/k8s/migration-pod.yaml \
        | kubectl -n "$NAMESPACE" apply -f -
      attempt=0
      while :; do
        phase=$(kubectl -n "$NAMESPACE" get pod "$POD" -o jsonpath='{.status.phase}')
        case "$phase" in
          Succeeded)
            kubectl -n "$NAMESPACE" logs "$POD" -c migrate --tail=200
            exit 0
            ;;
          Failed)
            kubectl -n "$NAMESPACE" logs "$POD" -c migrate --tail=200 || true
            exit 1
            ;;
        esac
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 150 ]; then
          kubectl -n "$NAMESPACE" logs "$POD" -c migrate --tail=200 || true
          echo "migration pod timed out" >&2
          exit 1
        fi
        sleep 2
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production

# Publish the corpus under deploy/kb/ as the active compshare-kb release.
#
# This repository is the only place where the corpus and cluster access already
# coexist: compshare-kb owns the database and the worker binary but does not
# carry the artifacts, and the artifacts are committed here.  Nothing else
# writes knowledge into production -- the serving process only reads, and the
# MCP update tools take at most twenty hand-authored chunks per call -- so
# without this job a rebuilt corpus stays in git and production keeps answering
# from the previous release.
#
# Deploying compshare-kb does NOT run this.  The two are independent: a deploy
# swaps the image and leaves the corpus alone; this swaps the corpus and leaves
# the image alone.
#
# If the worker creates the release but publication fails, re-running is
# rejected by the release id's primary key rather than silently importing
# twice.  Recover by publishing the existing candidate instead:
#   kubectl -n prj-ucompshare-prod exec compshare-kb-0 -- \
#     /usr/local/bin/compshare-kb-worker --action publish --release-id <id>
import-knowledge-release:
  stage: deploy
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    KB_STATEFULSET: compshare-kb
    KB_RELEASE_ID: kb-release-$CI_COMMIT_SHORT_SHA
    KB_RELEASE_VERSION: kb.compshare.$CI_COMMIT_SHORT_SHA
  # Two imports from different commits must not interleave. Job A's candidate
  # insert plus corpus load takes real time, and with import and publish now
  # separate, an overlapping run is the one way a stale candidate can end up
  # published over a newer one from this side. (The server-side guard is the
  # worker's base-match; this only stops the races we ourselves start.)
  resource_group: kb-import
  script:
    - |
      set -eu
      POD="compshare-kb-import-${CI_PIPELINE_ID}"
      cleanup() {
        kubectl -n "$NAMESPACE" delete pod "$POD" --ignore-not-found --wait=false >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      # Pair each corpus with its sidecar through the digest the sidecar
      # filename carries.  No digest is restated here: a regenerated or
      # renamed artifact fails this loop instead of importing a vector set
      # built for different text, and the worker re-checks the same bijection
      # server-side.  The \r strip makes the hash match on a CRLF checkout too.
      CP_FILES=""
      WORKER_ARGS=""
      for corpus in stage2b_w0 external_w0; do
        test -f "deploy/kb/$corpus.jsonl"
        digest=$(tr -d '\r' < "deploy/kb/$corpus.jsonl" | sha256sum | cut -d' ' -f1)
        sidecar="deploy/kb/embeddings_${digest}_qwen3-embedding-8b.jsonl"
        if ! test -f "$sidecar"; then
          echo "no embedding sidecar for deploy/kb/$corpus.jsonl (corpus digest $digest)" >&2
          exit 1
        fi
        echo "$corpus.jsonl $(wc -c < "deploy/kb/$corpus.jsonl") bytes -> $(basename "$sidecar") $(wc -c < "$sidecar") bytes"
        CP_FILES="$CP_FILES deploy/kb/$corpus.jsonl $sidecar"
        WORKER_ARGS="$WORKER_ARGS --corpus /work/$corpus.jsonl --embeddings /work/$(basename "$sidecar")"
      done

      # Read the two settings that decide WHERE this release lands out of the
      # serving process itself, rather than restating them or re-deriving them
      # from the manifest: this is the value the query plane is actually using,
      # and it stays correct if either one later moves into the Secret.  A wrong
      # knowledge-base name is the one failure mode with no symptom -- the
      # import succeeds, /healthz keeps reporting the old version, and nothing
      # logs a complaint.
      serving_env() {
        kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- printenv "$1" || true
      }
      POSTGRES_HOST=$(serving_env COMPSHARE_KB_POSTGRES_HOST)
      KNOWLEDGE_BASE=$(serving_env COMPSHARE_KB_KNOWLEDGE_BASE)
      test -n "$POSTGRES_HOST"
      test -n "$KNOWLEDGE_BASE"

      # The import binary validates the bundle the serving binary will load, and
      # the rune cap it validates against is a compile-time constant with no
      # runtime surface -- /healthz reports status, release_id and kb_version and
      # nothing else.  So the only available proof that the two agree is that
      # they are the same build.  A floating :latest gave no such proof; this
      # takes the image the StatefulSet is actually running, the same jsonpath
      # the compshare-kb repo's own deploy job checks.
      KB_IMAGE=$(kubectl -n "$NAMESPACE" get pod "${KB_STATEFULSET}-0" -o jsonpath='{.spec.containers[0].image}')
      test -n "$KB_IMAGE"
      echo "importing $KB_RELEASE_VERSION into knowledge base '$KNOWLEDGE_BASE' using $KB_IMAGE"

      # The candidate has to declare the release its corpus was BUILT on, and
      # that claim is checked here against what production is serving right now.
      # Deriving the parent at import time instead would record whatever is live
      # when this job runs -- which is exactly the release the corpus may not
      # have been built on.  Build on R0, let R1 publish while the candidate is
      # on its way, and an import-time read files the candidate as R1's child,
      # so publishing it overwrites content it never saw while the base match
      # reports success.  Checking it now also beats discovering it as a
      # publish-time ErrStaleCandidate, which says nothing about which corpus.
      if ! test -f deploy/kb/v2/release_base.json; then
        echo "deploy/kb/v2/release_base.json is missing." >&2
        echo "Build the candidate with: python -m scripts.rag_v2.release --parent-release-id <id> ..." >&2
        exit 1
      fi
      PARENT_RELEASE_ID=$(sed -n 's/^[[:space:]]*"parent_release_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' deploy/kb/v2/release_base.json)
      HEALTHZ=$(kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- wget -qO- http://127.0.0.1:8088/healthz)
      ACTIVE_RELEASE_ID=$(printf '%s' "$HEALTHZ" | sed -n 's/.*"release_id":"\([^"]*\)".*/\1/p')

      if [ -z "$PARENT_RELEASE_ID" ]; then
        if [ -n "$ACTIVE_RELEASE_ID" ]; then
          echo "this corpus records no parent release, but production is serving $ACTIVE_RELEASE_ID." >&2
          echo "Rebuild with: python -m scripts.rag_v2.release --parent-release-id $ACTIVE_RELEASE_ID ..." >&2
          exit 1
        fi
        BASE_ARGS="--allow-empty-parent"
        echo "no active release; importing as the first publication"
      else
        if [ "$PARENT_RELEASE_ID" != "$ACTIVE_RELEASE_ID" ]; then
          echo "this corpus was built on $PARENT_RELEASE_ID, production is serving $ACTIVE_RELEASE_ID." >&2
          echo "Publishing it would overwrite content the corpus never saw.  Rebuild on the" >&2
          echo "current release, or publish the pending candidate first." >&2
          exit 1
        fi
        BASE_ARGS="--parent-release-id $PARENT_RELEASE_ID"
        echo "corpus is based on $PARENT_RELEASE_ID, which is what production is serving"
      fi

      sed \
        -e "s|__IMAGE__|$KB_IMAGE|g" \
        -e "s|__POD_NAME__|$POD|g" \
        -e "s|__POSTGRES_HOST__|$POSTGRES_HOST|g" \
        -e "s|__KNOWLEDGE_BASE__|$KNOWLEDGE_BASE|g" \
        deploy/k8s/kb-import-pod.yaml \
        | kubectl -n "$NAMESPACE" apply -f -

      attempt=0
      until [ "$(kubectl -n "$NAMESPACE" get pod "$POD" -o jsonpath='{.status.phase}')" = "Running" ]; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 60 ]; then
          kubectl -n "$NAMESPACE" describe pod "$POD" || true
          echo "import pod did not reach Running" >&2
          exit 1
        fi
        sleep 5
      done

      for file in $CP_FILES; do
        base=$(basename "$file")
        echo "copying $base"
        kubectl -n "$NAMESPACE" cp "$file" "$POD:/work/$base"
        want=$(wc -c < "$file")
        got=$(kubectl -n "$NAMESPACE" exec "$POD" -- sh -c "wc -c < '/work/$base'" | tr -d '[:space:]')
        if [ "$want" != "$got" ]; then
          echo "$base copied as $got bytes, expected $want" >&2
          exit 1
        fi
      done

      # WORKER_ARGS and BASE_ARGS are deliberately unquoted: both are built
      # argument lists.  No --publish: --validate already defaults to true, so
      # this leaves a VALIDATED CANDIDATE and does not touch the active pointer.
      # Nothing a user sees changes until publish-knowledge-release is run, and
      # --require-base-match (default true) makes that later publish a
      # compare-and-swap against the parent recorded above.
      kubectl -n "$NAMESPACE" exec "$POD" -- /usr/local/bin/compshare-kb-worker \
        --action import \
        --knowledge-base "$KNOWLEDGE_BASE" \
        --release-id "$KB_RELEASE_ID" \
        --version "$KB_RELEASE_VERSION" \
        $BASE_ARGS \
        $WORKER_ARGS

      echo
      echo "candidate $KB_RELEASE_ID imported and validated; the active release is UNCHANGED."
      echo "Review deploy/kb/v2/release_diff.md (artifact of this job), then run"
      echo "publish-knowledge-release on this same commit to make it active."
      echo
      if [ -f deploy/kb/v2/release_diff.md ]; then
        echo "----- release_diff.md (head) -----"
        head -40 deploy/kb/v2/release_diff.md
        echo "----- (full report in this job's artifacts) -----"
      else
        echo "WARNING: deploy/kb/v2/release_diff.md is missing -- this candidate was built" >&2
        echo "without the orchestrated release command, so nobody can review what changed." >&2
      fi
  artifacts:
    paths:
      - deploy/kb/v2/release_diff.md
      - deploy/kb/v2/asset_report.json
    expire_in: 30 days
    when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    # Not `production`: importing a candidate changes nothing a user can see.
    # Naming it production would record a deployment that did not happen and
    # would make the real one, below, look like a repeat.
    name: production-kb-candidate

# The second half of the gate.  Separate from the import because a candidate
# nobody looked at is not a review, and the import job is where the reviewable
# diff is produced.  This job needs no import Pod, no corpus files and no
# image reference at all: `--action publish` takes only a release id, and it
# runs on the serving pod itself, i.e. on the SHA-pinned binary that will load
# the release.
#
# Rolling back is not automated: a retired release keeps its chunks and vectors
# (nothing deletes them) but no code path re-activates it.  Today that needs
#   UPDATE knowledge.kb_releases SET status='validated' WHERE id='<old-id>';
# followed by this job's worker command with that id -- two transactions, not
# one, so treat it as emergency recovery rather than a supported rollback.
publish-knowledge-release:
  stage: deploy
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    KB_STATEFULSET: compshare-kb
    KB_RELEASE_ID: kb-release-$CI_COMMIT_SHORT_SHA
    KB_RELEASE_VERSION: kb.compshare.$CI_COMMIT_SHORT_SHA
  resource_group: kb-publish
  script:
    - |
      set -eu
      echo "publishing $KB_RELEASE_ID ($KB_RELEASE_VERSION)"

      # Fails loudly if the candidate was never imported or never validated:
      # store.Publish requires status='validated' and refuses anything else.
      kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- \
        /usr/local/bin/compshare-kb-worker \
        --action publish \
        --release-id "$KB_RELEASE_ID"

      # Acceptance is what the SERVING process reports, not what the worker
      # returned: publication only moves a pointer, and the query plane picks it
      # up on its own reload interval.
      attempt=0
      until kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- \
        wget -qO- http://127.0.0.1:8088/healthz | grep -q "\"kb_version\":\"$KB_RELEASE_VERSION\""; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 20 ]; then
          echo "compshare-kb did not start serving $KB_RELEASE_VERSION within ~100s" >&2
          kubectl -n "$NAMESPACE" exec "${KB_STATEFULSET}-0" -- wget -qO- http://127.0.0.1:8088/healthz || true
          kubectl -n "$NAMESPACE" logs "${KB_STATEFULSET}-0" --tail=50 || true
          exit 1
        fi
        sleep 5
      done
      echo "compshare-kb is serving $KB_RELEASE_VERSION"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production

deploy:
  stage: deploy
  image: hub.ucloudadmin.com/prj-uhost-ussg/kubectl-alpine:1.17.17
  tags:
    - uaek-c5
  variables:
    NAMESPACE: prj-ucompshare-prod
    APP: compshare-agent
  script:
    - >-
      sed "s|__IMAGE__|$IMAGE:$CI_COMMIT_SHORT_SHA|g"
      deploy/k8s/deployment.yaml
      | kubectl -n "$NAMESPACE" apply -f -
    - kubectl -n "$NAMESPACE" rollout status deployment/"$APP" --timeout=600s
    - kubectl -n "$NAMESPACE" get service/"$APP"
    - |
      POD=$(kubectl -n "$NAMESPACE" get pods -l app="$APP" -o jsonpath='{.items[0].metadata.name}')
      test -n "$POD"
      # The Pod is already Ready by this point -- rollout status does not return
      # until the readinessProbe in deploy/k8s/deployment.yaml has had 200 from
      # /healthz on the Pod IP -- so what this checks is the SERVICE: DNS, the
      # selector, targetPort, and the round trip back to the only endpoint.
      #
      # That path is not ready the instant rollout status returns. EndpointSlice
      # and kube-proxy lag it by a second or two, and strategy: Recreate has
      # already removed the old Pod, so the ClusterIP briefly has no endpoint at
      # all and iptables DROPs the packets -- a connect timeout, not a refusal.
      # Without a retry the check was red on every deploy that actually replaced
      # the Pod and green on every no-op re-run of the same image tag, which is
      # exactly the wrong way round: pipeline 2516809 reported "deploy failed"
      # for a rollout that had succeeded, and its re-run passed only because
      # apply was "unchanged" and the Pod had been Ready for hours.
      #
      # Retrying rather than switching to 127.0.0.1:7429 is deliberate. The
      # re-run proves the Service round trip works on this cluster, so localhost
      # would drop the selector/targetPort coverage to buy nothing.
      probe() {
        kubectl -n "$NAMESPACE" exec "$POD" -c "$APP" -- python3 -c \
          'import urllib.request; response = urllib.request.urlopen("http://compshare-agent/healthz", timeout=5); assert response.status == 200'
      }
      attempt=0
      until probe >/dev/null 2>&1; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 10 ]; then
          echo "the Service round trip to /healthz did not succeed within ~30s" >&2
          kubectl -n "$NAMESPACE" get endpoints "$APP" -o wide || true
          probe || true
          exit 1
        fi
        sleep 3
      done
      echo "Service round trip to /healthz ok after $attempt retries"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
