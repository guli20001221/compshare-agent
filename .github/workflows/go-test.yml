name: Go Tests

# Full deterministic Go suite — the table-stakes correctness gate. Runs the
# entire `go test ./...` (unit tests + golden scripts) on every PR and on pushes
# to main.
#
# No model / server / DB needed: the real-model eval (eval.TestEval) and the
# in-process behavioral gate (cmd.TestBehavioralGate) self-skip without their
# -model / -behavioral-gate flags, so this job stays fast, free, and
# deterministic. The nightly real-model behavioral gate lives in
# behavioral-gate.yml; the old eval/intent accuracy-gate.yml and skills-ci.yml
# were removed with the P6 router / skills-loader deletion.
#
# Complements entity-race.yml (which adds -race on internal/entity); this adds
# full-suite coverage that CI was previously missing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test ./...
        run: go test ./... -count=1

      # The SSH-ops guardrails decide which commands may execute inside a customer instance,
      # and until now NO job ran their tests — the classification corpus and the whole scrub
      # suite were manual-only, so a regression in the tier that separates "print the swap
      # table" from "enable swap" could reach production with CI green. Both files are
      # stdlib-only, self-contained, and exit non-zero on the first failure, so this costs
      # about a second and needs no dependency install.
      #
      # The SDK is installed for ONE reason: test_harness.py's INV-9 checks against the REAL
      # build_options — that `tools`, `setting_sources` and `skills` are all empty in the object
      # the harness actually ships, and that the pinned SDK still gives `skills=[]` the meaning
      # those asserts assume. Without it that block prints SKIPPED and the job stays green while
      # the one invariant that keeps a control-plane built-in out of a customer instance goes
      # unchecked. Pinned to the same version as requirements.txt — an unpinned install would
      # silently test a different SDK than production runs. paramiko is deliberately NOT
      # installed: ssh_transport imports it lazily, so the offline suites do not need it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the pinned Agent SDK (for the INV-9 real-options check)
        run: pip install claude-agent-sdk==0.2.106

      # All nine suites, not two: the skill-deletion assertions (`skill-tool-no-longer-exists`,
      # `skills-directory-is-gone`) live in test_write_mode.py, and a gate that runs only some of
      # the files invites the next invariant to be written into an ungated one.
      - name: ssh-ops harness suites (guardrails, INV-9, redaction, write mode)
        working-directory: deploy/ssh_ops_harness
        run: |
          python3 test_guardrails.py
          python3 test_harness.py
          python3 test_write_mode.py
          python3 test_clip.py
          python3 test_confirm_loop.py
          python3 test_endpoint_probe.py
          python3 test_guest_endpoint_probe.py
          python3 test_remote_text.py
          python3 test_atomic_file.py
          python3 test_remote_job.py
          python3 test_process_env.py
