name: Go Tests

# Full deterministic Go suite — the table-stakes correctness gate. Runs the
# entire `go test ./...` (unit tests + golden scripts) on every PR and on pushes
# to main.
#
# No model / server / DB needed: the real-model eval (eval.TestEval) and the
# in-process behavioral gate (cmd.TestBehavioralGate) self-skip without their
# -model / -behavioral-gate flags, so this job stays fast, free, and
# deterministic. The nightly real-model behavioral gate lives in
# behavioral-gate.yml; the old eval/intent accuracy-gate.yml and skills-ci.yml
# were removed with the P6 router / skills-loader deletion.
#
# Complements entity-race.yml (which adds -race on internal/entity); this adds
# full-suite coverage that CI was previously missing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test ./...
        run: go test ./... -count=1

      # The SSH-ops guardrails decide which commands may execute inside a customer instance,
      # and until now NO job ran their tests — 353 classification cases and the whole scrub
      # suite were manual-only, so a regression in the tier that separates "print the swap
      # table" from "enable swap" could reach production with CI green. Both files are
      # stdlib-only, self-contained, and exit non-zero on the first failure, so this costs
      # about a second and needs no dependency install.
      - name: ssh-ops guardrails (classification + redaction)
        working-directory: deploy/ssh_ops_harness
        run: |
          python3 test_guardrails.py
          python3 test_harness.py
