name: Durable Turn Protocol

on:
  pull_request:
    paths:
      - ".github/workflows/turn-protocol-ci.yml"
      - "deploy/migrations/**"
      - "internal/agentpool/**"
      - "internal/engine/**"
      - "internal/httpapi/**"
      - "internal/store/**"
      - "internal/tools/**"
      - "internal/turncoord/**"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-and-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: compshare_context_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compshare_context_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COMPSHARE_TEST_MYSQL_DSN: postgresql://postgres@127.0.0.1:5432/compshare_context_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Real PostgreSQL protocol tests with race detector
        run: >-
          go test -race
          ./internal/store
          ./internal/turncoord
          ./internal/agentpool
          ./internal/tools
          ./internal/engine
          ./internal/httpapi
          -count=1
