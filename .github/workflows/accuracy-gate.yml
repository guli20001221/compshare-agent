name: Accuracy Gate

# Real-model intent-router accuracy gates. Runs the production model
# (deepseek-v4-flash via ModelVerse) over two labeled sets and fails the job if
# accuracy drops below the regression floor. Two complementary arms:
#
#   1. fixtures (TestOnlineRouterEval) — 68 synthetic fixtures.jsonl, scores
#      intent-equality accuracy. Floor = 80% (main baseline ~87%, 59-60/68).
#   2. routing handling-class (TestOnlineRoutingHandlingEval, P0 阶段0 §③) — 173
#      production-representative cases from 637 real sessions
#      (eval/realism/route_label_637/), maps router intent → handling_class and
#      scores per-class accuracy + an 8×8 confusion matrix. The PRIMARY axis is
#      handling_class (the MECE-stable downstream-handling taxonomy), so the gate
#      survives the planned taxonomy convergence (image 6→1, tail merges) without
#      relabeling. Gate basis = ROUTABLE accuracy (all 8 classes except
#      greeting_smalltalk, which the router has no intent for — it is separated
#      behaviorally in the behavioral gate, not here).
#
# Deliberately NOT on `pull_request`: each run makes ~70 + ~173 real LLM calls
# (cost + ~20 min wall-clock + depends on api.modelverse.cn reachability), so PRs
# stay fast and free. The gate runs nightly and on-demand instead. The
# deterministic offline mock (TestOfflineFixturesEval) still guards every PR via
# the normal `go test ./...`.
#
# The routing arm starts REPORT-ONLY (min_route_acc=0): the first nightly run on
# main establishes the baseline accuracy + confusion matrix; flip the floor to
# (baseline - margin) in a follow-up once the per-class numbers are curated
# (over-strict last-turn artifacts on slot-fill create sessions, etc).
#
# NOTE: requires api.modelverse.cn to be reachable from the runner. If the
# GitHub-hosted runner cannot reach it, move this job to a China-resident
# self-hosted runner (change `runs-on`).

on:
  workflow_dispatch:
    inputs:
      model:
        description: "model name/ID from eval/models.go"
        default: "deepseek-v4-flash"
      min_intent_acc:
        description: "fixtures arm: fail if intent accuracy (%) is below this"
        default: "80"
      min_route_acc:
        description: "routing arm: fail if ROUTABLE handling-class accuracy (%) is below this (0 = report-only)"
        default: "0"
  schedule:
    - cron: "0 18 * * *" # 02:00 China time (UTC+8)

jobs:
  intent-router-accuracy:
    runs-on: ubuntu-latest
    # 25m + 35m step budgets + checkout/Go-setup/module-download headroom.
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fixtures intent accuracy gate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          go test ./eval/intent -run TestOnlineRouterEval -v \
            -model "${{ github.event.inputs.model || 'deepseek-v4-flash' }}" \
            -min-intent-acc "${{ github.event.inputs.min_intent_acc || '80' }}" \
            -timeout 25m

      - name: Routing handling-class accuracy gate (§③)
        if: always() # run even if the fixtures arm failed — both baselines are useful
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          go test ./eval/intent -run TestOnlineRoutingHandlingEval -v \
            -model "${{ github.event.inputs.model || 'deepseek-v4-flash' }}" \
            -min-route-acc "${{ github.event.inputs.min_route_acc || '0' }}" \
            -timeout 35m
