name: stock_availability
description: 用户问某 GPU 机型现在有没有货 / 是否售罄 / 哪些机型能买等实时可售性时触发
intent_label: stock_availability
route_group: catalog
required_tools:
  - DescribeAvailableCompShareInstanceTypes
tool_subset:
  - DescribeAvailableCompShareInstanceTypes
  - DescribeCompShareSupportZone
  - DescribeCompShareGpuInventory
  - CheckCompShareResourceCapacity
  - DescribeCompShareImages
required_citation: false
handler_key: handleStockAvailability
agent_slots: [search_query, zone]
planner_directives:
  - 'Classify GPU stock availability questions like "4090 有没有货" or "H100 库存" as stock_availability. Do not route them to resource_info or unknown.'
  - 'Fill slots.search_query with the GPU model or family when the user names one. Fill slots.zone only when the user explicitly names a zone or exact zone label.'
planner_examples:
  - question: "4090 现在有没有货"
    confidence: 0.85
    search_query: "4090"
  - question: "上海二B 4090 有库存吗"
    confidence: 0.86
    search_query: "4090"
    zone: "上海二B"
verification_status: production_validated
field_refs_verified: true
provenance: human_authored
