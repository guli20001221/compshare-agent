name: refund_estimate
description: 用户问某台实例现在释放/退订大概能退多少钱时触发；这是只读估算，不执行释放
intent_label: refund_estimate
route_group: billing
required_tools:
  - GetCompShareRefundPrice
tool_subset:
  - DescribeCompShareInstance
  - GetCompShareRefundPrice
required_citation: false
handler_key: handleRefundEstimate
planner_directives:
  - 'Classify instance refund-estimate questions like "这台现在释放能退多少钱", "退订大概退多少", or "实例现在退款多少" as refund_estimate and include the target instance.'
  - 'Use this route only for read-only refund estimation. Do not release instances. Ask the user to select a target when no instance target is present.'
planner_examples:
  - question: "train-a 现在释放能退多少钱"
    confidence: 0.86
verification_status: production_validated
field_refs_verified: true
provenance: human_authored
