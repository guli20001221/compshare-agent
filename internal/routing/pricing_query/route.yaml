name: pricing_query
description: 用户问某 GPU 机型的当前账号价格或明确目录价（多少钱 / 包月包日 / spot 价）时触发
intent_label: pricing_query
route_group: catalog
required_tools:
  - GetCompShareInstanceUserPrice
tool_subset:
  - GetCompShareInstanceUserPrice
  - DescribeCompShareSupportZone
  - DescribeAvailableCompShareInstanceTypes
required_citation: false
handler_key: handlePricingQuery
planner_directives:
  - 'Classify GPU purchase-price questions about price, cost, billing rate, hourly price, daily price, or monthly price as pricing_query.'
  - 'Use pricing_query when the user names a GPU. Render current-account prices by default; render original price fields when the user explicitly asks for catalog, list, or standard price.'
  - 'Route "X 多少钱一小时", "X 价格", "X 包月多少", "X 包日多少", "X spot 价", and "X 抢占式价" to pricing_query.'
  - 'Use pricing_query only for pre-purchase instance-type prices. Route personal existing-bill complaints like "账单怎么这么高" or "扣费太多" to billing_instance. Route named plan/package billing-rule questions to knowledge_qa.'
planner_examples:
  - question: "4090 多少钱一小时"
    confidence: 0.9
  - question: "A100 包月多少钱"
    confidence: 0.85
verification_status: production_validated
field_refs_verified: true
provenance: human_authored
