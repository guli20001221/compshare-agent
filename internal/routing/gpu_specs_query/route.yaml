name: gpu_specs_query
description: 用户问 GPU 机型的显存 / 性能 / 最大卡数 / CPU·内存组合等静态规格时触发
intent_label: gpu_specs_query
route_group: catalog
required_tools:
  - DescribeAvailableCompShareInstanceTypes
tool_subset:
  - DescribeAvailableCompShareInstanceTypes
  - GetGPUSpecs
required_citation: false
handler_key: handleGPUSpecsQuery
agent_slots: [search_query, detail_level]
planner_directives:
  - 'Classify GPU memory, performance, max-card-count, and static specification questions as gpu_specs_query; render a summary first.'
  - 'Classify requests for all specs, complete specs, one GPU model''s full specs, CPU/memory combinations, CPU and memory, or optional configurations as gpu_specs_query.'
  - 'Fill slots.search_query with the GPU model or family when present. Set slots.detail_level to summary by default and full when the user asks for complete specs, CPU/memory combinations, or all configurations.'
planner_examples:
  - question: "4090 显存多大"
    confidence: 0.85
    search_query: "4090"
    detail_level: summary
  - question: "4090 的所有规格"
    confidence: 0.86
    search_query: "4090"
    detail_level: full
verification_status: production_validated
field_refs_verified: true
provenance: human_authored
