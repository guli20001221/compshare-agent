name: model_repository_browse
description: 用户问公共模型仓库有哪些模型、有哪些模型标签、某个模型或某类标签下有哪些模型时触发
intent_label: model_repository_browse
route_group: catalog
required_tools:
  - DescribeModelRepositoryModels
  - DescribeModelRepositoryTags
tool_subset:
  - DescribeModelRepositoryModels
  - DescribeModelRepositoryTags
required_citation: false
handler_key: handleModelRepositoryBrowse
planner_directives:
  - 'Classify public model repository model, LLM model, and model-tag browse questions as model_repository_browse.'
  - 'Route requests to deploy, run, or create an instance for a model to deploy_model or operation_lifecycle. Do not route them to model_repository_browse.'
  - 'Route image catalog questions like "有哪些 PyTorch 镜像" to image_list. Route model download, how-to, and tutorial questions to knowledge_qa.'
planner_examples:
  - question: "模型仓库里有哪些模型可以用"
    confidence: 0.85
verification_status: production_validated
field_refs_verified: true
provenance: human_authored
