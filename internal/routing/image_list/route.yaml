name: image_list
description: 用户问平台官方镜像、自制镜像、社区镜像、共享给自己的镜像列表或某类镜像候选时触发；具体镜像来源由 router 写入 slots.image_source
intent_label: image_list
route_group: catalog
required_tools:
  - DescribeCompShareImages
  - DescribeCompShareCustomImages
  - DescribeCommunityImages
  - DescribeCompShareSharingImages
tool_subset:
  - DescribeCompShareImages
  - DescribeCompShareCustomImages
  - DescribeCommunityImages
  - DescribeCompShareSharingImages
required_citation: false
handler_key: handleImageList
planner_directives:
  - Image list questions about platform official images, user-owned custom/private images, community marketplace images, or images shared to the user should emit image_list and set slots.image_source to platform, custom, community, or shared when the source is explicit; leave it empty when the source is not explicit.
  - Concrete image list/search questions like "有哪些 PyTorch 镜像", "查询社区镜像", "查询自制镜像", or "共享给我的镜像有哪些" should use image_list, not image_tag_catalog or model_repository_browse.
  - Concept/how-to questions like "系统镜像和基础镜像有什么区别" or "怎么发布社区镜像" stay in knowledge_qa, NOT image_list.
planner_examples:
  - question: "查询平台镜像列表"
    confidence: 0.85
    image_source: platform
  - question: "查询自制镜像"
    confidence: 0.85
    image_source: custom
  - question: "查询社区镜像"
    confidence: 0.85
    image_source: community
  - question: "别人共享给我的镜像在哪看"
    confidence: 0.86
    image_source: shared
verification_status: production_validated
field_refs_verified: true
provenance: human_authored
